* { box-sizing: border-box; }
html, body { margin: 0; }

.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }

.money { white-space: nowrap; font-variant-numeric: tabular-nums; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }

.warnings { display: grid; gap: 8px; }

.tablewrap { overflow-x: auto; }

@media (prefers-reduced-motion: no-preference) { nav a, .seg { transition: color .15s, border-color .15s; } }

function money(c, opts = {}) {
  if (c === null || c === undefined || isNaN(c)) return '<span class="money sub">—</span>';
  const neg = c < 0; let v = Math.round(Math.abs(c));
  const g = Math.floor(v / 10000), s = Math.floor((v % 10000) / 100), cu = v % 100;
  let parts = [];
  if (g) parts.push(`${g.toLocaleString("es-ES")}<i class="g"></i>`);
  if (g || s) parts.push(`${g ? String(s).padStart(2, "0") : s}<i class="s"></i>`);
  if (!g) parts.push(`${s ? String(cu).padStart(2, "0") : cu}<i class="c"></i>`);
  const cls = opts.color ? (neg ? " neg" : " pos") : (neg ? " neg" : "");
  const sign = neg ? "−" : (opts.signed ? "+" : "");
  return `<span class="money${cls}" title="${(c / 10000).toFixed(2)} oro">${sign}${parts.join(" ")}</span>`;
}
const confPill = c => `<span class="pill ${c === "alta" ? "good" : c === "media" ? "warn" : "bad"}" title="Confianza en el precio y en las ventas">confianza ${c}</span>`;
const pct = x => x === null || x === undefined ? "—" : `${(x * 100).toFixed(0)} %`;

const itemName = id => (PLAN.items[id] && PLAN.items[id].name) || `item:${id}`;
const METHOD = { vendedor: ["vendedor", "mute"], subasta: ["subasta", "info"], fabricar: ["lo fabricas", "gold"] };

/* ---------------- Gráficas ---------------- */
function spark(id) {
  const it = PLAN.items[id]; if (!it || !it.hist || it.hist.length < 2) return "";
  const v = it.hist.map(h => h[1]).filter(x => x);
  const lo = Math.min(...v), hi = Math.max(...v), w = 90, h = 26, p = 3;
  const x = i => p + i * (w - 2 * p) / (v.length - 1), y = val => h - p - (hi === lo ? .5 : (val - lo) / (hi - lo)) * (h - 2 * p);
  const d = v.map((val, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(val).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/><circle cx="${x(v.length - 1)}" cy="${y(v[v.length - 1])}" r="2.5"/></svg>`;
}

function lineChart(id) {
  const it = PLAN.items[id]; const hist = (it.hist || []).filter(h => h[1]);
  if (hist.length < 2) return '<p class="sub">Sin histórico suficiente.</p>';
  const W = 720, H = 240, L = 64, R = 16, T = 14, B = 28;
  const vals = hist.map(h => h[1]); const refs = [it.med7].filter(Boolean);
  let lo = Math.min(...vals, ...refs), hi = Math.max(...vals, ...refs);
  const pad = (hi - lo) * .12 || hi * .1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const x = i => L + i * (W - L - R) / (hist.length - 1), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = 4; let g = "";
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${(v / 10000).toFixed(v < 100000 ? 2 : 1)}g</text>`;
  }
  hist.forEach((h, i) => { if (i % 3 === 0 || i === hist.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${h[0].slice(8)}/${h[0].slice(5, 7)}</text>`; });
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = d + `L${x(vals.length - 1)},${H - B}L${x(0)},${H - B}Z`;
  let ref = "";
  if (it.med7) ref = `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(it.med7)}" y2="${y(it.med7)}"/><text x="${W - R}" y="${y(it.med7) - 5}" text-anchor="end">mediana 7 días</text>`;
  const last = vals.length - 1;
  return `<svg class="chart" id="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precio de ${esc(it.name)} en 14 días">
    ${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${ref}
    <line class="hair" id="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/>
    <circle class="dot" cx="${x(last)}" cy="${y(vals[last])}" r="5"/>
    <rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
}

function qtyChart(id) {
  const it = PLAN.items[id]; const hist = (it.hist || []).filter(h => h[2] !== null);
  if (hist.length < 2) return "";
  const W = 720, H = 120, L = 64, R = 16, T = 10, B = 24;
  const hi = Math.max(...hist.map(h => h[2])) * 1.1 || 1;
  const bw = (W - L - R) / hist.length;
  let g = `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><text x="${L - 6}" y="${T + 8}" text-anchor="end">${Math.round(hi)}</text><text x="${L - 6}" y="${H - B}" text-anchor="end">0</text>`;
  hist.forEach((h, i) => {
    const bh = (h[2] / hi) * (H - T - B);
    g += `<rect class="qb" x="${L + i * bw + 2}" y="${H - B - bh}" width="${Math.max(2, bw - 4)}" height="${bh}" rx="2"><title>${h[0]}: ${h[2]} publicadas</title></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cantidad publicada por día">${g}</svg>`;
}

    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(hist.length - 1, Math.round((p.x - L) / ((W - L - R) / (hist.length - 1)))));
    const xx = L + i * (W - L - R) / (hist.length - 1);
    hair.setAttribute("x1", xx); hair.setAttribute("x2", xx); hair.style.display = "";
    tip.innerHTML = `${hist[i][0]} · ${money(hist[i][1])} · ${hist[i][2]} publicadas`;
    tip.style.display = "block"; tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY - 10) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; hair.style.display = "none"; });
}

function renderCartera() {
  const C = PLAN.portfolio;
  const ST = { stop: ["vende: stop", "bad"], objetivo: ["vende: objetivo", "good"], vencida: ["fecha pasada", "warn"], espera: ["espera", "mute"], cerrada: ["cerrada", "mute"] };
  const rows = C.positions.map(p => `<tr class="${p.status === "cerrada" ? "off" : ""}"><td><b>${esc(p.name)}</b><div class="sub">${p.sold ? `vendidas ${fmtN(p.sold)} · ` : ""}plan ${fmtN(p.plan_qty)}</div></td>
      <td class="n">${fmtN(p.qty)}</td><td class="n">${money(p.entry)}<div class="sub">${p.entry_src.startsWith("lo que") ? "real" : "previsto"}</div></td>
      <td class="n">${money(p.mv)}</td><td class="n">${money(p.pnl, { signed: true, color: true })}<div class="sub">${p.pnl_pct === null ? "" : (p.pnl_pct > 0 ? "+" : "") + pct(p.pnl_pct)}</div></td>
      <td class="n">${money(p.realized, { signed: true, color: true })}</td>
      <td class="n">${money(p.target)}<div class="sub">stop ${money(p.stop)}</div></td><td class="n">${p.due ? esc(p.due.slice(8) + "/" + p.due.slice(5, 7)) : "—"}<div class="sub">${p.days_left === null ? "" : p.days_left > 0 ? "faltan " + p.days_left + " d" : "pasada"}</div></td>
      <td><span class="pill ${ST[p.status][1]}">${ST[p.status][0]}</span><div class="sub">${esc(p.advice)}</div></td><td>${spark(p.item)}</td></tr>`).join("");
  const led = C.ledger.map(e => `<tr><td class="n">${esc(e.t)}</td><td>${esc(e.char)}</td><td><span class="pill ${e.op === "BUY" ? "info" : "good"}">${e.op === "BUY" ? "compra" : "venta"}</span></td><td>${esc(e.name)}</td><td class="n">${fmtN(e.qty)}</td><td class="n">${money(e.unit)}</td><td class="n">${money(e.total)}</td></tr>`).join("");
  $("#v-cartera").innerHTML = `<div class="tiles">
      <div class="tile"><span class="k">Lo que te costó</span><span class="v">${money(C.cost)}</span><span class="s">apuestas abiertas</span></div>
      <div class="tile"><span class="k">Lo que vale hoy</span><span class="v">${money(C.value)}</span><span class="s">vendiendo ahora, sin el 5 %</span></div>
      <div class="tile hero"><span class="k">Resultado abierto</span><span class="v">${money(C.pnl, { signed: true, color: true })}</span><span class="s">todavía no realizado</span></div>
      <div class="tile"><span class="k">Ya ganado</span><span class="v">${money(C.realized, { signed: true, color: true })}</span><span class="s">ventas cobradas por correo</span></div>
      <div class="tile"><span class="k">Piden que actúes</span><span class="v num">${C.alerts}</span><span class="s">ya están en la ruta</span></div>
    </div>
    <div class="panel"><header><h2>Apuestas abiertas</h2></header>
      <p class="lead">Cada apuesta que importas en el addon queda anotada con su objetivo, su stop y su fecha. El precio de compra es el que pagaste de verdad si el addon registró la compra. Cuando una toca venderse, la venta aparece sola en la ruta del personaje que la tiene.</p>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Tienes</th><th class="n">Pagaste/u</th><th class="n">Hoy/u</th><th class="n">Resultado</th><th class="n">Ya ganado</th><th class="n">Objetivo</th><th class="n">Fecha</th><th>Qué hacer</th><th>14 días</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Aún no hay apuestas. Importa en el addon la ruta de la pestaña Ideas.</p>'}</div>
    <div class="panel"><header><h2>Últimas compras y ventas</h2><span class="sub">las registra el addon: compras en subasta y ventas cobradas en el correo</span></header>
      ${led ? `<div class="tablewrap"><table><thead><tr><th class="n">Cuándo</th><th>Quién</th><th>Tipo</th><th>Objeto</th><th class="n">Cant.</th><th class="n">Precio/u</th><th class="n">Total</th></tr></thead><tbody>${led}</tbody></table></div>` : '<p class="sub">Sin movimientos todavía.</p>'}</div>`;
}

let invLoc = "todo", invSort = "total";
function renderInventario() {
  const ACTION = { ruta: ["la usa la ruta", "good"], guardar: ["guardar", "info"], subasta: ["vender en subasta", "gold"], vendedor: ["al vendedor", "mute"], esperar: ["vender más tarde", "warn"], cartera: ["apuesta abierta", "gold"], nada: ["—", "mute"] };
  const LOC = { bags: "bolsas", bank: "banco", warband: "banco de banda" };
  const blocks = PLAN.inventory.map(v => {
    const slots = Object.entries(v.slots).filter(([, s]) => s).map(([loc, s]) => {
      const used = s.total - s.free, p = used / s.total * 100;
      return `<div class="row"><span>${LOC[loc]}</span><div class="bar" title="${used} de ${s.total} huecos ocupados"><span class="${s.free / s.total < .1 ? "full" : ""}" style="width:${p}%"></span></div><span class="num sub">${s.free} libres</span></div>`;
    }).join("");
    let items = v.items.filter(e => invLoc === "todo" || e.loc === invLoc);
    items.sort((a, b) => invSort === "slot" ? a.per_slot - b.per_slot : b.total - a.total);
    const rows = items.map(e => `<tr><td><b>${esc(e.name)}</b><div class="sub">${LOC[e.loc]}</div></td><td class="n">${e.count}</td>
      <td class="n">${money(e.unit)}</td><td class="n">${money(e.total)}</td><td class="n">${e.slots}</td><td class="n">${money(e.per_slot)}</td>
      <td><span class="pill ${ACTION[e.action][1]}">${ACTION[e.action][0]}</span><div class="sub">${esc(e.why)}</div></td></tr>`).join("");
    return `<div class="panel"><header><h2>${esc(v.short)}</h2><span class="stats">${v.money !== null && v.money !== undefined ? `<span>Oro <b>${money(v.money)}</b></span>` : ""}<span>Objetos <b>${money(v.value)}</b></span></span></header>
      <div class="slots">${slots}</div>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Cant.</th><th class="n">Valor/u</th><th class="n">Total</th><th class="n">Huecos</th><th class="n">Valor/hueco</th><th>Qué hacer</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Nada en esta zona.</p>'}</div>`;
  }).join("");
  $("#v-inventario").innerHTML = `<div class="panel"><header><h2>Qué tienes</h2>
      <div class="filters"><label for="invloc" class="sub">Zona</label><select id="invloc"><option value="todo">Todo</option><option value="bags">Bolsas</option><option value="bank">Banco</option><option value="warband">Banco de banda</option></select>
      <label for="invsort" class="sub">Orden</label><select id="invsort"><option value="total">Más valioso primero</option><option value="slot">Menos valor por hueco primero</option></select></div></header>
      <p class="lead">El valor de cada objeto es lo que sacarías vendiéndolo (subasta neta o vendedor, lo que sea más). Ordena por <b>valor por hueco</b> para ver qué ocupa sitio en el banco y vale poco.</p></div>` + blocks;
  $("#invloc").value = invLoc; $("#invsort").value = invSort;
  $("#invloc").onchange = e => { invLoc = e.target.value; renderInventario(); };
  $("#invsort").onchange = e => { invSort = e.target.value; renderInventario(); };
}

let mkItem = null, mkQuery = "";
function renderMercado() {
  const ids = Object.keys(PLAN.items).filter(id => PLAN.items[id].hist && PLAN.items[id].hist.length)
    .sort((a, b) => PLAN.items[a].name.localeCompare(PLAN.items[b].name));
  if (!mkItem || !PLAN.items[mkItem]) mkItem = ids.find(id => PLAN.opportunities[0] && +id === PLAN.opportunities[0].out_item) || ids[0];
  const it = PLAN.items[mkItem];
  const list = ids.filter(id => PLAN.items[id].name.toLowerCase().includes(mkQuery.toLowerCase()))
    .map(id => `<button aria-pressed="${id === String(mkItem)}" data-id="${id}"><span>${esc(PLAN.items[id].name)}</span>${spark(id)}</button>`).join("");
  $("#v-mercado").innerHTML = `<div class="panel market">
    <div><label class="sub" for="mkq">Buscar objeto</label><input type="search" id="mkq" value="${esc(mkQuery)}" placeholder="Thorium, Lotus…" style="width:100%;margin:4px 0 8px"><div class="itemlist">${list}</div></div>
    <div style="display:grid;gap:12px;min-width:0">
      <header style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>${esc(it.name)}</h2>${confPill(it.conf)}</header>
      <div class="stats"><span>Mínimo <b>${money(it.min)}</b></span><span>Valor de mercado <b>${money(it.mv)}</b></span><span>Mediana 7 días <b>${money(it.med7)}</b></span><span>Publicadas <b>${it.qty}</b></span><span>Ventas/día ≈ <b>${fmtN(it.vol)}</b></span>${it.vendor_buy ? `<span>Vendedor <b>${money(it.vendor_buy)}</b></span>` : ""}${it.trend !== null ? `<span>Tendencia <b>${it.trend > 0 ? "+" : ""}${pct(it.trend)}</b></span>` : ""}</div>
      <h3>Valor de mercado, últimos 14 días</h3>${lineChart(mkItem)}
      <h3>Cantidad publicada</h3>${qtyChart(mkItem)}
    </div></div>`;
  $("#v-mercado").querySelectorAll("[data-id]").forEach(b => b.onclick = () => { mkItem = b.dataset.id; renderMercado(); });
  const q = $("#mkq"); q.oninput = e => { mkQuery = e.target.value; const pos = e.target.selectionStart; renderMercado(); const n = $("#mkq"); n.focus(); n.setSelectionRange(pos, pos); };
  wireChart(mkItem);
}

const RENDER = { resumen: renderResumen, ruta: renderRuta, recetas: renderRecetas, transformar: renderTransformar, aprender: renderAprender, ideas: renderIdeas, cartera: renderCartera, inventario: renderInventario, mercado: renderMercado };
function show() {
  const h = location.hash.replace("#", "");
  const v = RENDER[h] ? h : "resumen";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === v ? "page" : "false"));
  RENDER[v]();
}
$("#tabs").innerHTML = VIEWS.map(([k, t]) => `<a href="#${k}" data-v="${k}">${t}</a>`).join("");
renderMeta();
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
