<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oroboros · Plan de oro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra de pestañas fija arriba; cada vista es una columna de paneles. Resumen primero, detalle después. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #18202a;
  --ink-2: #4b5664;
  --ink-3: #7b8592;
  --line: #d9dee5;
  --accent: #b07a12;          /* oro */
  --accent-soft: #f6ead0;
  --good: #1f7a4d; --good-soft: #dff1e7;
  --warn: #9a5b00; --warn-soft: #fbeccc;
  --bad: #b3261e;  --bad-soft: #f8dedb;
  --info: #2b5c8a; --info-soft: #dfe9f4;
  --coin-g: #c99a1c; --coin-s: #9aa3ad; --coin-c: #b06a3b;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --panel: #1a2129; --ink: #e8edf2; --ink-2: #aab4bf; --ink-3: #7d8894; --line: #2d3742;
    --accent: #e0aa3e; --accent-soft: #3a2f17;
    --good: #5cc28d; --good-soft: #17352a; --warn: #e5a54a; --warn-soft: #3b2d14;
    --bad: #f0857c; --bad-soft: #3d1f1d; --info: #8ab4e0; --info-soft: #1c2c3d;
    --coin-g: #e0b23c; --coin-s: #b9c1ca; --coin-c: #d08a5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #1a2129; --ink: #e8edf2; --ink-2: #aab4bf; --ink-3: #7d8894; --line: #2d3742;
  --accent: #e0aa3e; --accent-soft: #3a2f17;
  --good: #5cc28d; --good-soft: #17352a; --warn: #e5a54a; --warn-soft: #3b2d14;
  --bad: #f0857c; --bad-soft: #3d1f1d; --info: #8ab4e0; --info-soft: #1c2c3d;
  --coin-g: #e0b23c; --coin-s: #b9c1ca; --coin-c: #d08a5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 16px; font-family: var(--font-body); font-weight: 600; }
.num, td.n { font-variant-numeric: tabular-nums; }
a { color: var(--info); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body > header { padding: 20px 20px 0; max-width: 1200px; margin: 0 auto; display: grid; gap: 6px; }
body > header .meta { color: var(--ink-2); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav .tabs { max-width: 1200px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }
nav a { padding: 12px 12px 10px; color: var(--ink-2); text-decoration: none; white-space: nowrap; border-bottom: 3px solid transparent; font-weight: 500; }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
section.view { display: none; gap: 18px; }
section.view.on { display: grid; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.panel > header { padding: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: none; margin: 0; }
.lead { color: var(--ink-2); max-width: 70ch; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { color: var(--ink-2); font-size: 13px; }
.tile .v { font-size: 22px; font-weight: 600; }
.tile.hero { border-color: var(--accent); background: linear-gradient(0deg, var(--panel), var(--panel)), var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.tile .s { color: var(--ink-3); font-size: 12px; }

.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.money i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 3px 1px 1px; vertical-align: middle; }
.money i.g { background: var(--coin-g); } .money i.s { background: var(--coin-s); } .money i.c { background: var(--coin-c); }
.money.neg { color: var(--bad); }
.money.pos { color: var(--good); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.mute { background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }
.pill.gold { background: var(--accent-soft); color: var(--accent); }

.warnings { display: grid; gap: 8px; }
.warning { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.warning b { color: var(--warn); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
tr.detail td { background: var(--bg); padding: 14px 16px; }
tr.off td { color: var(--ink-3); }
.sub { color: var(--ink-3); font-size: 12px; }

.opp { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.opp:last-child { border-bottom: 0; }
.opp .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opp .w { color: var(--ink-2); font-size: 14px; grid-column: 1 / -1; }
.opp .p { text-align: right; font-weight: 600; font-size: 17px; }

ul.why { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 80ch; }
.tree { font-size: 14px; display: grid; gap: 2px; }
.tree .node { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tree .kids { margin-left: 18px; padding-left: 10px; border-left: 2px solid var(--line); display: grid; gap: 2px; }

.route-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.seg[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.route { font: 13px/1.6 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; display: grid; }
.route .l { display: grid; grid-template-columns: 56px 1fr; gap: 10px; white-space: pre; }
.route .op { font-weight: 600; }
.route .BUY .op { color: var(--info); } .route .SELL .op { color: var(--good); }
.route .CRAFT .op { color: var(--accent); } .route .NOTE .op { color: var(--ink-3); } .route .HOLD .op { color: var(--warn); }
.route .c { color: var(--ink-3); }
.route .hd { color: var(--ink-3); }
.stats { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }
.stats b { color: var(--ink); }

.bar { height: 10px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; background: var(--ink-3); }
.bar span.full { background: var(--bad); }
.slots { display: grid; gap: 8px; }
.slots .row { display: grid; grid-template-columns: 120px 1fr 90px; gap: 10px; align-items: center; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; background: var(--panel); align-content: start; }
.card.top { border-color: var(--accent); }
.card .big { font-size: 20px; font-weight: 600; }
.gap { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="search"], select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 11px var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .ref { stroke: var(--ink-3); stroke-dasharray: 4 4; }
.chart .qb { fill: var(--info); opacity: .55; }
.chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.chart .hair { stroke: var(--ink-3); stroke-width: 1; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 13px; display: none; z-index: 20; white-space: nowrap; }
.spark { width: 90px; height: 26px; display: block; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.spark circle { fill: var(--accent); }
.itemlist { display: grid; gap: 2px; max-height: 520px; overflow-y: auto; }
.itemlist button { text-align: left; border: 0; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.itemlist button[aria-pressed="true"] { background: var(--accent-soft); }
.market { display: grid; grid-template-columns: 260px 1fr; gap: 18px; }
@media (max-width: 760px) {
  .market { grid-template-columns: 1fr; }
  .itemlist { max-height: 220px; }
  .slots .row { grid-template-columns: 90px 1fr 70px; }
}
@media (prefers-reduced-motion: no-preference) { nav a, .seg { transition: color .15s, border-color .15s; } }
</style>
</head>
<body>
<header>
  <h1>Oroboros · Plan de oro</h1>
  <div class="meta" id="meta"></div>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main>
  <section class="view" id="v-resumen"></section>
  <section class="view" id="v-ruta"></section>
  <section class="view" id="v-recetas"></section>
  <section class="view" id="v-transformar"></section>
  <section class="view" id="v-aprender"></section>
  <section class="view" id="v-ideas"></section>
  <section class="view" id="v-cartera"></section>
  <section class="view" id="v-inventario"></section>
  <section class="view" id="v-mercado"></section>
  <section class="view" id="v-horas"></section>
  <section class="view" id="v-farmear"></section>
</main>
<div class="tip" id="tip"></div>
<script>
const PLAN = /*__PLAN__*/null;

const VIEWS = [
  ["resumen", "Resumen"], ["ruta", "Ruta"], ["recetas", "Qué ganas y por qué"],
  ["transformar", "Transformaciones"], ["aprender", "Qué aprender"], ["ideas", "Ideas"], ["cartera", "Cartera"], ["inventario", "Qué tienes"], ["mercado", "Mercado"], ["horas", "Horas"], ["farmear", "Farmear"],
];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = ck => ck ? ck.split("-")[0] : "—";

function money(c, opts = {}) {
  if (c === null || c === undefined || isNaN(c)) return '<span class="money sub">—</span>';
  const neg = c < 0; let v = Math.round(Math.abs(c));
  const g = Math.floor(v / 10000), s = Math.floor((v % 10000) / 100), cu = v % 100;
  let parts = [];
  if (g) parts.push(`${g.toLocaleString("es-ES")}<i class="g"></i>`);
  if (g || s) parts.push(`${g ? String(s).padStart(2, "0") : s}<i class="s"></i>`);
  if (!g) parts.push(`${s ? String(cu).padStart(2, "0") : cu}<i class="c"></i>`);
  const cls = opts.color ? (neg ? " neg" : " pos") : (neg ? " neg" : "");
  const sign = neg ? "−" : (opts.signed ? "+" : "");
  return `<span class="money${cls}" title="${(c / 10000).toFixed(2)} oro">${sign}${parts.join(" ")}</span>`;
}
const confPill = c => `<span class="pill ${c === "alta" ? "good" : c === "media" ? "warn" : "bad"}" title="Confianza en el precio y en las ventas">confianza ${c}</span>`;
const pct = x => x === null || x === undefined ? "—" : `${(x * 100).toFixed(0)} %`;
const fmtN = x => x === null || x === undefined ? "—" : (Math.round(x * 10) / 10).toLocaleString("es-ES");
const itemName = id => (PLAN.items[id] && PLAN.items[id].name) || `item:${id}`;
const METHOD = { vendedor: ["vendedor", "mute"], subasta: ["subasta", "info"], fabricar: ["lo fabricas", "gold"] };

/* ---------------- Gráficas ---------------- */
function spark(id) {
  const it = PLAN.items[id]; if (!it || !it.hist || it.hist.length < 2) return "";
  const v = it.hist.map(h => h[1]).filter(x => x);
  const lo = Math.min(...v), hi = Math.max(...v), w = 90, h = 26, p = 3;
  const x = i => p + i * (w - 2 * p) / (v.length - 1), y = val => h - p - (hi === lo ? .5 : (val - lo) / (hi - lo)) * (h - 2 * p);
  const d = v.map((val, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(val).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/><circle cx="${x(v.length - 1)}" cy="${y(v[v.length - 1])}" r="2.5"/></svg>`;
}

// Rango del historial en Mercado (días; 0 = todo), al estilo CamelCamelCamel
const RANGES = [[30, "1 mes"], [90, "3 meses"], [180, "6 meses"], [365, "1 año"], [0, "Todo"]];
let mkRange = 90;
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function rangeHist(it, days) {
  const h = it.hist || []; if (!h.length) return h;
  const d = days === undefined ? mkRange : days; if (!d) return h;
  const last = h[h.length - 1][0];
  return h.filter(x => dayDiff(x[0], last) < d);
}
function priceStats(it) {
  const all = (it.hist || []).filter(h => h[1]), rng = rangeHist(it).filter(h => h[1]);
  const ext = (arr, f) => arr.length ? arr.reduce((a, b) => f(b[1], a[1]) ? b : a) : null;
  const avg = d => { const v = rangeHist(it, d).filter(h => h[1]).map(h => h[1]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  return { lowR: ext(rng, (x, y) => x < y), highR: ext(rng, (x, y) => x > y), lowA: ext(all, (x, y) => x < y), highA: ext(all, (x, y) => x > y),
           avg7: avg(7), avg30: avg(30), avg90: avg(90), first: all.length ? all[0][0] : null };
}
const fmtDay = d => d ? `${d.slice(8)}/${d.slice(5, 7)}/${d.slice(2, 4)}` : "—";
function statsTable(it) {
  const s = priceStats(it), cell = h => h ? `${money(h[1])} <span class="sub">(${fmtDay(h[0])})</span>` : "—";
  const lbl = RANGES.find(r => r[0] === mkRange)[1];
  return `<table id="mk-stats"><tbody>
    <tr><th>Mínimo (${esc(lbl.toLowerCase())})</th><td>${cell(s.lowR)}</td><th>Mínimo histórico</th><td>${cell(s.lowA)}</td></tr>
    <tr><th>Máximo (${esc(lbl.toLowerCase())})</th><td>${cell(s.highR)}</td><th>Máximo histórico</th><td>${cell(s.highA)}</td></tr>
    <tr><th>Media 7 / 30 / 90 días</th><td colspan="3">${money(s.avg7)} · ${money(s.avg30)} · ${money(s.avg90)} <span class="sub">· datos desde ${fmtDay(s.first)}</span></td></tr>
  </tbody></table>`;
}

function lineChart(id) {
  const it = PLAN.items[id]; const hist = rangeHist(it).filter(h => h[1]);
  if (hist.length < 2) return '<p class="sub">Sin histórico suficiente.</p>';
  const W = 720, H = 240, L = 64, R = 16, T = 14, B = 28;
  const vals = hist.map(h => h[1]); const refs = [it.med7].filter(Boolean);
  let lo = Math.min(...vals, ...refs), hi = Math.max(...vals, ...refs);
  const pad = (hi - lo) * .12 || hi * .1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const x = i => L + i * (W - L - R) / (hist.length - 1), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = 4; let g = "";
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${(v / 10000).toFixed(v < 100000 ? 2 : 1)}g</text>`;
  }
  const step = Math.max(1, Math.ceil(hist.length / 10));
  hist.forEach((h, i) => { if (i % step === 0 || i === hist.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${h[0].slice(8)}/${h[0].slice(5, 7)}</text>`; });
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = d + `L${x(vals.length - 1)},${H - B}L${x(0)},${H - B}Z`;
  let ref = "";
  if (it.med7) ref = `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(it.med7)}" y2="${y(it.med7)}"/><text x="${W - R}" y="${y(it.med7) - 5}" text-anchor="end">mediana 7 días</text>`;
  const last = vals.length - 1;
  return `<svg class="chart" id="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precio de ${esc(it.name)}">
    ${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${ref}
    <line class="hair" id="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/>
    <circle class="dot" cx="${x(last)}" cy="${y(vals[last])}" r="5"/>
    <rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
}

function qtyChart(id) {
  const it = PLAN.items[id]; const hist = rangeHist(it).filter(h => h[2] !== null);
  if (hist.length < 2) return "";
  const W = 720, H = 120, L = 64, R = 16, T = 10, B = 24;
  const hi = Math.max(...hist.map(h => h[2])) * 1.1 || 1;
  const bw = (W - L - R) / hist.length;
  let g = `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><text x="${L - 6}" y="${T + 8}" text-anchor="end">${Math.round(hi)}</text><text x="${L - 6}" y="${H - B}" text-anchor="end">0</text>`;
  hist.forEach((h, i) => {
    const bh = (h[2] / hi) * (H - T - B);
    g += `<rect class="qb" x="${L + i * bw + 2}" y="${H - B - bh}" width="${Math.max(2, bw - 4)}" height="${bh}" rx="2"><title>${h[0]}: ${h[2]} publicadas</title></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cantidad publicada por día">${g}</svg>`;
}

function wireChart(id) {
  const svg = $("#lc"); if (!svg) return;
  const it = PLAN.items[id]; const hist = rangeHist(it).filter(h => h[1]);
  const tip = $("#tip"), hair = $("#hair"), hit = $("#hit");
  const L = 64, R = 16, W = 720;
  hit.addEventListener("mousemove", ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(hist.length - 1, Math.round((p.x - L) / ((W - L - R) / (hist.length - 1)))));
    const xx = L + i * (W - L - R) / (hist.length - 1);
    hair.setAttribute("x1", xx); hair.setAttribute("x2", xx); hair.style.display = "";
    tip.innerHTML = `${hist[i][0]} · ${money(hist[i][1])} · ${hist[i][2]} publicadas`;
    tip.style.display = "block"; tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY - 10) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; hair.style.display = "none"; });
}

function treeHTML(nodes, depth = 0) {
  return nodes.map(n => {
    const [lab, cls] = METHOD[n.method];

    return `<div class="node"><b>${fmtN(n.per_craft)}×</b> ${esc(n.name)} <span class="pill ${cls}">${lab}</span> ${money(n.unit)}/u${alts ? `<span class="sub">(${alts})</span>` : ""}${n.method === "fabricar" ? ` <span class="sub">receta ${esc(n.recipe_name)} · ${esc(short(n.char))}</span>` : ""}</div>` +
      (n.children ? `<div class="kids">${treeHTML(n.children, depth + 1)}</div>` : "");
  }).join("");
}

  const cb = $("#copyi");
  if (cb) cb.onclick = async () => {
    try { await navigator.clipboard.writeText(r.text); $("#copiedi").textContent = "Copiada. Pégala en el addon con Ctrl+V."; }
    catch (e) { $("#copiedi").textContent = "Tu navegador no deja copiar: selecciona el texto y cópialo a mano."; }
  };
}

function renderCartera() {
  const C = PLAN.portfolio;
  const ST = { stop: ["vende: stop", "bad"], objetivo: ["vende: objetivo", "good"], vencida: ["fecha pasada", "warn"], espera: ["espera", "mute"], cerrada: ["cerrada", "mute"] };
  const rows = C.positions.map(p => `<tr class="${p.status === "cerrada" ? "off" : ""}"><td><b>${esc(p.name)}</b><div class="sub">${p.sold ? `vendidas ${fmtN(p.sold)} · ` : ""}plan ${fmtN(p.plan_qty)}</div></td>
      <td class="n">${fmtN(p.qty)}</td><td class="n">${money(p.entry)}<div class="sub">${p.entry_src.startsWith("lo que") ? "real" : "previsto"}</div></td>
      <td class="n">${money(p.mv)}</td><td class="n">${money(p.pnl, { signed: true, color: true })}<div class="sub">${p.pnl_pct === null ? "" : (p.pnl_pct > 0 ? "+" : "") + pct(p.pnl_pct)}</div></td>
      <td class="n">${money(p.realized, { signed: true, color: true })}</td>
      <td class="n">${money(p.target)}<div class="sub">stop ${money(p.stop)}</div></td><td class="n">${p.due ? esc(p.due.slice(8) + "/" + p.due.slice(5, 7)) : "—"}<div class="sub">${p.days_left === null ? "" : p.days_left > 0 ? "faltan " + p.days_left + " d" : "pasada"}</div></td>
      <td><span class="pill ${ST[p.status][1]}">${ST[p.status][0]}</span><div class="sub">${esc(p.advice)}</div></td><td>${spark(p.item)}</td></tr>`).join("");
  const led = C.ledger.map(e => `<tr><td class="n">${esc(e.t)}</td><td>${esc(e.char)}</td><td><span class="pill ${e.op === "BUY" ? "info" : "good"}">${e.op === "BUY" ? "compra" : "venta"}</span></td><td>${esc(e.name)}</td><td class="n">${fmtN(e.qty)}</td><td class="n">${money(e.unit)}</td><td class="n">${money(e.total)}</td></tr>`).join("");
  $("#v-cartera").innerHTML = `<div class="tiles">
      <div class="tile"><span class="k">Lo que te costó</span><span class="v">${money(C.cost)}</span><span class="s">apuestas abiertas</span></div>
      <div class="tile"><span class="k">Lo que vale hoy</span><span class="v">${money(C.value)}</span><span class="s">vendiendo ahora, sin el 5 %</span></div>
      <div class="tile hero"><span class="k">Resultado abierto</span><span class="v">${money(C.pnl, { signed: true, color: true })}</span><span class="s">todavía no realizado</span></div>
      <div class="tile"><span class="k">Ya ganado</span><span class="v">${money(C.realized, { signed: true, color: true })}</span><span class="s">ventas cobradas por correo</span></div>
      <div class="tile"><span class="k">Piden que actúes</span><span class="v num">${C.alerts}</span><span class="s">ya están en la ruta</span></div>
    </div>
    <div class="panel"><header><h2>Apuestas abiertas</h2></header>
      <p class="lead">Cada apuesta que importas en el addon queda anotada con su objetivo, su stop y su fecha. El precio de compra es el que pagaste de verdad si el addon registró la compra. Cuando una toca venderse, la venta aparece sola en la ruta del personaje que la tiene.</p>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Tienes</th><th class="n">Pagaste/u</th><th class="n">Hoy/u</th><th class="n">Resultado</th><th class="n">Ya ganado</th><th class="n">Objetivo</th><th class="n">Fecha</th><th>Qué hacer</th><th>14 días</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Aún no hay apuestas. Importa en el addon la ruta de la pestaña Ideas.</p>'}</div>
    <div class="panel"><header><h2>Últimas compras y ventas</h2><span class="sub">las registra el addon: compras en subasta y ventas cobradas en el correo</span></header>
      ${led ? `<div class="tablewrap"><table><thead><tr><th class="n">Cuándo</th><th>Quién</th><th>Tipo</th><th>Objeto</th><th class="n">Cant.</th><th class="n">Precio/u</th><th class="n">Total</th></tr></thead><tbody>${led}</tbody></table></div>` : '<p class="sub">Sin movimientos todavía.</p>'}</div>`;
}

let invLoc = "todo", invSort = "total";
function renderInventario() {
  const ACTION = { ruta: ["la usa la ruta", "good"], guardar: ["guardar", "info"], subasta: ["vender en subasta", "gold"], vendedor: ["al vendedor", "mute"], esperar: ["vender más tarde", "warn"], cartera: ["apuesta abierta", "gold"], nada: ["—", "mute"] };
  const LOC = { bags: "bolsas", bank: "banco", warband: "banco de banda" };
  const blocks = PLAN.inventory.map(v => {
    const slots = Object.entries(v.slots).filter(([, s]) => s).map(([loc, s]) => {
      const used = s.total - s.free, p = used / s.total * 100;
      return `<div class="row"><span>${LOC[loc]}</span><div class="bar" title="${used} de ${s.total} huecos ocupados"><span class="${s.free / s.total < .1 ? "full" : ""}" style="width:${p}%"></span></div><span class="num sub">${s.free} libres</span></div>`;
    }).join("");
    let items = v.items.filter(e => invLoc === "todo" || e.loc === invLoc);
    items.sort((a, b) => invSort === "slot" ? a.per_slot - b.per_slot : b.total - a.total);
    const rows = items.map(e => `<tr><td><b>${esc(e.name)}</b><div class="sub">${LOC[e.loc]}</div></td><td class="n">${e.count}</td>
      <td class="n">${money(e.unit)}</td><td class="n">${money(e.total)}</td><td class="n">${e.slots}</td><td class="n">${money(e.per_slot)}</td>
      <td><span class="pill ${ACTION[e.action][1]}">${ACTION[e.action][0]}</span><div class="sub">${esc(e.why)}</div></td></tr>`).join("");
    return `<div class="panel"><header><h2>${esc(v.short)}</h2><span class="stats">${v.money !== null && v.money !== undefined ? `<span>Oro <b>${money(v.money)}</b></span>` : ""}<span>Objetos <b>${money(v.value)}</b></span></span></header>
      <div class="slots">${slots}</div>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Cant.</th><th class="n">Valor/u</th><th class="n">Total</th><th class="n">Huecos</th><th class="n">Valor/hueco</th><th>Qué hacer</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Nada en esta zona.</p>'}</div>`;
  }).join("");
  $("#v-inventario").innerHTML = `<div class="panel"><header><h2>Qué tienes</h2>
      <div class="filters"><label for="invloc" class="sub">Zona</label><select id="invloc"><option value="todo">Todo</option><option value="bags">Bolsas</option><option value="bank">Banco</option><option value="warband">Banco de banda</option></select>
      <label for="invsort" class="sub">Orden</label><select id="invsort"><option value="total">Más valioso primero</option><option value="slot">Menos valor por hueco primero</option></select></div></header>
      <p class="lead">El valor de cada objeto es lo que sacarías vendiéndolo (subasta neta o vendedor, lo que sea más). Ordena por <b>valor por hueco</b> para ver qué ocupa sitio en el banco y vale poco.</p></div>` + blocks;
  $("#invloc").value = invLoc; $("#invsort").value = invSort;
  $("#invloc").onchange = e => { invLoc = e.target.value; renderInventario(); };
  $("#invsort").onchange = e => { invSort = e.target.value; renderInventario(); };
}

let mkItem = null, mkQuery = "";
function renderHoras() {
  const BANDS = ["0–4", "4–8", "8–12", "12–16", "16–20", "20–24"];
  const ids = Object.keys(PLAN.items).filter(id => PLAN.items[id].hours)
    .sort((a, b) => PLAN.items[a].name.localeCompare(PLAN.items[b].name));
  if (!ids.length) {
    $("#v-horas").innerHTML = `<div class="panel"><header><h2>Franjas horarias</h2></header>
      <p class="lead">Sin datos de franjas. Escanea varias veces al día (con <code>/reload</code> después), exporta con <code>--archive work/archivo.sqlite</code> y genera el plan con <code>--archive work/archivo.sqlite</code>.</p></div>`;
    return;
  }
  const row = id => {
    const h = PLAN.items[id].hours, max = Math.max(1, ...h.map(b => b.gone_cheap_h || 0));
    const cells = h.map(b => {
      if (b.gone_cheap_h === null) return `<td class="n" style="color:var(--muted)">—</td>`;
      const a = (b.gone_cheap_h / max) * 0.55;
      return `<td class="n" style="background:rgba(214,170,60,${a.toFixed(2)})" title="${b.n} mediciones en ${b.days} días">
        ${fmtN(b.gone_cheap_h)}/h${b.ok ? "" : " ?"}<div class="sub">${fmtN(b.gone_total_h)}/h total · ${b.price_med ? money(b.price_med) : "—"}</div></td>`;
    }).join("");
    return `<tr><td>${esc(PLAN.items[id].name)}</td>${cells}</tr>`;
  };
  $("#v-horas").innerHTML = `<div class="panel"><header><h2>Franjas horarias</h2></header>
    <p class="lead">Unidades baratas que desaparecen por hora en cada franja (debajo: el total y el precio típico). Más color = se vende más. «?» = menos de 3 mediciones en 2 días: todavía no es fiable.</p>
    <div class="tablewrap"><table><thead><tr><th>Objeto</th>${BANDS.map(b => `<th class="n">${b} h</th>`).join("")}</tr></thead>
    <tbody>${ids.map(row).join("")}</tbody></table></div></div>`;
}

function renderMercado() {
  const ids = Object.keys(PLAN.items).filter(id => PLAN.items[id].hist && PLAN.items[id].hist.length)
    .sort((a, b) => PLAN.items[a].name.localeCompare(PLAN.items[b].name));
  if (!mkItem || !PLAN.items[mkItem]) mkItem = ids.find(id => PLAN.opportunities[0] && +id === PLAN.opportunities[0].out_item) || ids[0];
  const it = PLAN.items[mkItem];
  const list = ids.filter(id => PLAN.items[id].name.toLowerCase().includes(mkQuery.toLowerCase()))
    .map(id => `<button aria-pressed="${id === String(mkItem)}" data-id="${id}"><span>${esc(PLAN.items[id].name)}</span>${spark(id)}</button>`).join("");
  $("#v-mercado").innerHTML = `<div class="panel market">
    <div><label class="sub" for="mkq">Buscar objeto</label><input type="search" id="mkq" value="${esc(mkQuery)}" placeholder="Thorium, Lotus…" style="width:100%;margin:4px 0 8px"><div class="itemlist">${list}</div></div>
    <div style="display:grid;gap:12px;min-width:0">
      <header style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>${esc(it.name)}</h2>${confPill(it.conf)}</header>
      <div class="stats"><span>Mínimo <b>${money(it.min)}</b></span><span>Valor de mercado <b>${money(it.mv)}</b></span><span>Mediana 7 días <b>${money(it.med7)}</b></span><span>Publicadas <b>${it.qty}</b></span><span>Ventas/día ≈ <b>${fmtN(it.vol)}</b></span>${it.vendor_buy ? `<span>Vendedor <b>${money(it.vendor_buy)}</b></span>` : ""}${it.trend !== null ? `<span>Tendencia <b>${it.trend > 0 ? "+" : ""}${pct(it.trend)}</b></span>` : ""}</div>
      <div class="ranges" role="group" aria-label="Rango">${RANGES.map(([d, t]) => `<button class="seg" data-range="${d}" aria-pressed="${d === mkRange}">${t}</button>`).join("")}</div>
      ${statsTable(it)}
      <h3>Valor de mercado</h3>${lineChart(mkItem)}
      <h3>Cantidad publicada</h3>${qtyChart(mkItem)}
    </div></div>`;
  $("#v-mercado").querySelectorAll("[data-id]").forEach(b => b.onclick = () => { mkItem = b.dataset.id; renderMercado(); });
  $("#v-mercado").querySelectorAll("[data-range]").forEach(b => b.onclick = () => { mkRange = +b.dataset.range; renderMercado(); });
  const q = $("#mkq"); q.oninput = e => { mkQuery = e.target.value; const pos = e.target.selectionStart; renderMercado(); const n = $("#mkq"); n.focus(); n.setSelectionRange(pos, pos); };
  wireChart(mkItem);
}

/* ---------------- Farmear (docs/farmeo.md) ---------------- */
let farmChar = null;
const CONTINENT = { 0: "Reinos del Este", 1: "Kalimdor" };
const fItem = id => (PLAN.farm && PLAN.farm.names && PLAN.farm.names[id]) || itemName(id);
const fTime = s => s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min` : `${Math.round(s / 60)} min`;
const fTop = items => (items || []).map(([id, q, v]) => `<li>${esc(fItem(id))} <span class="sub">×${fmtN(q)}</span> ${money(v)}</li>`).join("");
const SOURCE = { medido: ["medido", "good"], mixto: ["medido en parte", "info"], estimado: ["aproximado: solo materiales", "mute"] };
// Nombre del sitio: el juego lo resuelve (OroborosDB.farmPlaces) y el exportador lo trae; si no, continente y coordenadas
function cellPlace(r) {
  const k = `${r.map}:${r.cell[0]}:${r.cell[1]}`, p = PLAN.farm.places && PLAN.farm.places[k];
  if (p) return `${esc(p.zone)}${p.x !== undefined ? ` <span class="sub">(${fmtN(p.x)}, ${fmtN(p.y)})</span>` : ""}`;
  return `${CONTINENT[r.map] || "Mapa " + r.map} <span class="sub">(x ${Math.round(r.x)}, y ${Math.round(r.y)} del mundo)</span>`;
}
const mapName = id => (PLAN.farm.maps && PLAN.farm.maps[id]) || `Mapa ${id}`;

function renderFarmear() {
  const F = PLAN.farm;
  if (!F) { $("#v-farmear").innerHTML = `<div class="panel"><header><h2>Farmear</h2></header><p class="lead">Este plan no trae datos de farmeo.</p></div>`; return; }
  const keys = Object.keys(F.chars).sort((a, b) => (F.chars[b].level || 0) - (F.chars[a].level || 0));
  if (!farmChar || !F.chars[farmChar]) farmChar = keys[0];
  const C = F.chars[farmChar] || { explore: [], gather: [], kinds: [] };
  const measured = F.measured.length ? `<div class="tablewrap"><table><thead><tr><th>Dónde</th><th class="n">Oro/h</th><th class="n">Muertes</th><th class="n">Tiempo activo</th><th class="n">Por muerte</th><th>Criaturas</th><th>Lo que más te dejó</th><th>Confianza</th></tr></thead><tbody>${
    F.measured.map(r => `<tr><td><b>${esc(r.sub)}</b><div class="sub">${esc(r.zone)}</div></td>
      <td class="n">${r.gph !== null ? money(r.gph) : '<span class="sub">poco tiempo</span>'}</td><td class="n">${r.kills}</td><td class="n">${fTime(r.secs)}</td>
      <td class="n">${money(r.per_kill)}</td>
      <td>${r.mobs.slice(0, 3).map(m => `${esc(m.name)}${m.level ? ` <span class="sub">${m.level}</span>` : ""}${m.cls && m.cls !== "normal" ? ` <span class="pill warn">${esc(m.cls)}</span>` : ""}`).join("<br>")}</td>
      <td><ul class="why">${fTop(r.top_items)}</ul></td><td>${confPill(r.confidence)}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="lead">Aún no hay nada medido. Con Oroboros activo, mata criaturas y despójalas; al hacer <code>/reload</code> o salir, el plan lo recoge.</p>`;
  const card = (r, i) => {
    const [src, cls] = SOURCE[r.source] || SOURCE.estimado;
    return `<div class="card ${i === 0 ? "top" : ""}">
      <div class="t"><h3>${r.mobs.slice(0, 2).map(m => esc(m.name)).join(" y ")}</h3><div class="sub">${cellPlace(r)}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${cls}">${src}</span>${confPill(r.confidence)}${r.saturated ? '<span class="pill warn" title="Sacarías más de lo que la subasta vende al día: el resto va al vendedor">satura la subasta</span>' : ""}</div>
      <div class="big">${money(r.gph)}<span class="sub"> /h</span></div>
      <div class="stats"><span>Rango <b>${money(r.gph_range[0])} – ${money(r.gph_range[1])}</b></span><span>Nivel <b>${r.levels[0]}–${r.levels[1]}</b></span><span>≈ <b>${Math.round(r.kph)}</b> muertes/h</span><span><b>${r.spawns}</b> apariciones</span></div>
      <details><summary>Qué matar y qué sueltan</summary><ul class="why">${r.mobs.map(m => `<li>${esc(m.name)} <span class="sub">niv. ${m.levels[0]}–${m.levels[1]} · ${pct(m.share)} de las apariciones</span> ${money(m.measured ? m.measured.per_kill : m.per_kill)}<span class="sub">/muerte${m.measured ? ` (medido, ${m.measured.kills} muertes)` : ""}</span></li>`).join("")}</ul>
      <ul class="why">${fTop(r.top_items)}</ul></details>
    </div>`;
  };
  const explore = !F.has_ac ? `<p class="lead">Para proponer sitios donde aún no has farmeado hace falta la base de AzerothCore: <code>python tools/oroboros_farm.py --descargar</code> (≈ 48 MB, en <code>work/fuentes/</code>).</p>`
    : !C.level ? `<p class="lead">No sé el nivel de este personaje: entra con él y haz <code>/reload</code>.</p>`
    : C.explore.length ? `<div class="cards">${C.explore.map(card).join("")}</div>` : `<p class="lead">Nada a tu nivel en mundo abierto.</p>`;
  const KIND = { herb: "Botánica", mine: "Minería" };
  const gather = !C.kinds.length ? `<p class="lead">Este personaje no tiene Botánica ni Minería.</p>`
    : !F.has_gm ? `<p class="lead">No encuentro GatherMate2_Data (carpeta Forever) en la carpeta de addons del juego.</p>`
    : `<div class="tablewrap"><table><thead><tr><th>Mapa</th><th>Profesión</th><th class="n">Nodos conocidos</th><th class="n">Nodos/h</th><th class="n">Oro/h</th><th>Qué sacas</th></tr></thead><tbody>${
      C.gather.map(g => `<tr><td><b>${esc(mapName(g.map))}</b></td><td>${KIND[g.kind]}</td><td class="n">${g.nodes}</td><td class="n">${Math.round(g.nph)}</td>
        <td class="n">${money(g.gph)}${g.saturated ? ' <span class="pill warn">satura</span>' : ""}</td>
        <td><ul class="why">${fTop(g.top_items)}</ul>${g.unvalued.length ? `<div class="sub">Sin valorar: ${g.unvalued.map(esc).join(", ")}</div>` : ""}${g.above_skill.length ? `<div class="sub">Por encima de tu nivel (${g.skill}): ${g.above_skill.map(esc).join(", ")}</div>` : ""}${g.rare.length ? `<div class="sub">Raros, no estimados: ${g.rare.map(esc).join(", ")}</div>` : ""}${g.unchecked.length ? `<div class="sub">Nivel sin comprobar: ${g.unchecked.map(esc).join(", ")}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
  $("#v-farmear").innerHTML = `<div class="panel"><header><h2>Farmear</h2><div class="route-tabs">${keys.map(k => `<button class="seg" aria-pressed="${k === farmChar}" data-fch="${esc(k)}">${esc(short(k))}${F.chars[k].level ? ` · ${F.chars[k].level}` : ""}</button>`).join("")}</div></header>
    <p class="lead">Criaturas de mundo abierto (sin élites ni zonas de élites), de tu nivel o hasta 12 por debajo. Lo que mides en el juego manda: con 30 muertes sustituye a la estimación.</p></div>
    <div class="panel"><header><h2>Donde ya has farmeado</h2></header>${measured}</div>
    <div class="panel"><header><h2>Por explorar</h2></header><p class="lead">Estimación inicial con la base de AzerothCore (WotLK): solo oro y materiales, sin equipo. El botín de Forever cambió, así que es aproximado hasta que lo midas.</p>${explore}</div>
    <div class="panel"><header><h2>Recolección</h2></header><p class="lead">Nodos de GatherMate2 (Forever) valorados con lo que suelta cada nodo; 30 nodos/h en un mapa denso. Solo los nodos de tu nivel de profesión (niveles del juego clásico, sin comprobar en Forever).</p>${gather}</div>`;
  $("#v-farmear").querySelectorAll("[data-fch]").forEach(b => b.onclick = () => { farmChar = b.dataset.fch; renderFarmear(); });
}

const RENDER = { resumen: renderResumen, ruta: renderRuta, recetas: renderRecetas, transformar: renderTransformar, aprender: renderAprender, ideas: renderIdeas, cartera: renderCartera, inventario: renderInventario, mercado: renderMercado, horas: renderHoras, farmear: renderFarmear };
function show() {
  const h = location.hash.replace("#", "");
  const v = RENDER[h] ? h : "resumen";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === v ? "page" : "false"));
  RENDER[v]();
}
$("#tabs").innerHTML = VIEWS.map(([k, t]) => `<a href="#${k}" data-v="${k}">${t}</a>`).join("");
renderMeta();
window.addEventListener("hashchange", show);
show();
</script>
