<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oroboros · Plan de oro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Estilo de la subasta moderna del juego (lienzo «Oroboros estilo WoW», versión E): ventana casi negra con
   borde fino, título pequeño dorado centrado, etiquetas doradas, valores en blanco, botones planos y pestañas
   planas colgando abajo (las del plan con borde dorado, como las de los addons). Un solo tema, oscuro. */
:root {
  --world: #120d16;
  --bg: #0f0e0d;              /* fondo de la ventana */
  --panel: #151311;           /* zonas dentro de la ventana */
  --panel-2: #1a1816;         /* botones y filas de lista */
  --ink: #e6e0d0;             /* texto */
  --ink-hi: #ffffff;          /* valores */
  --ink-2: #b4ad9c;
  --ink-3: #8c8579;
  --line: #2c2925;            /* borde claro de los biseles */
  --edge: #000;               /* borde oscuro */
  --gold: #ffd100;            /* etiquetas y títulos del juego */
  --accent: #ffd100;
  --accent-soft: rgba(255,190,60,.16);
  --good: #1eff00; --good-soft: #10260c;
  --warn: #ff9d2a; --warn-soft: #2e1f08;
  --bad: #ff4b3a;  --bad-soft: #2e0d0a;
  --info: #4a9eff; --info-soft: #0d1a2e;
  --coin-g: radial-gradient(circle at 35% 35%, #ffe27a, #c48a10);
  --coin-s: radial-gradient(circle at 35% 35%, #ffffff, #8d8d8d);
  --coin-c: radial-gradient(circle at 35% 35%, #f0a06a, #8a4a1c);
  --font-display: "Tenor Sans", "Friz Quadrata TT", Optima, "Segoe UI", sans-serif;
  --font-body: "Tenor Sans", "Friz Quadrata TT", Optima, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: radial-gradient(ellipse at 70% 10%, #4a2f52 0%, #2a1d33 40%, var(--world) 100%) fixed; background-color: var(--world); min-height: 100%; }
html, body { margin: 0; }
/* la ventana: el cuerpo de la página, con la barra de título arriba y las pestañas colgando abajo */
body { max-width: 1240px; margin: 14px auto 0; min-height: calc(100vh - 14px); display: flex; flex-direction: column;
       background: repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px), var(--bg);
       border: 1px solid var(--edge); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.7);
       color: var(--ink); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.25; color: var(--gold); }
h1 { font-size: 15px; letter-spacing: .2px; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
b, strong { color: var(--ink-hi); font-weight: 400; }
.num, td.n { font-variant-numeric: tabular-nums; }
a { color: var(--gold); }
button { font: inherit; }
code { font-family: var(--font-mono); font-size: 13px; color: var(--ink-hi); }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }

body > header { order: 1; padding: 7px 40px 8px; text-align: center; display: grid; gap: 2px;
                background: linear-gradient(#1a1816, #121110); border-bottom: 1px solid var(--edge); box-shadow: 0 1px 0 var(--line); }
body > header .meta { color: var(--ink-3); font-size: 12px; }
body > header .meta b { color: var(--ink-2); }
main { order: 2; flex: 1; width: 100%; padding: 16px; display: grid; gap: 14px; align-content: start; }
nav { order: 3; position: sticky; bottom: 0; z-index: 5; background: linear-gradient(rgba(18,13,22,0), var(--world) 35%); padding: 0 16px; margin: 0 -1px -1px; }
nav .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px; }
nav a { font-family: var(--font-display); padding: 7px 16px 8px; color: var(--ink-2); text-decoration: none; white-space: nowrap; font-size: 14px;
        background: #121110; border: 1px solid var(--edge); border-top: none; box-shadow: inset 0 0 0 1px #2a2622; }
nav a:hover { color: var(--ink-hi); }
nav a:not([data-v="inicio"]):not([data-v="subasta"]):not([data-v="ventas"]) { color: var(--gold); box-shadow: inset 0 0 0 1px #8a6d1c; }
nav a[aria-current="page"] { color: var(--ink-hi) !important; background: #1c1a18; box-shadow: inset 0 0 0 1px #3a3631, inset 0 -2px 0 var(--gold) !important; }

section.view { display: none; gap: 14px; }
section.view.on { display: grid; }
/* zonas: sin tarjetas redondeadas; separadas por el bisel fino del juego */
.panel { background: rgba(255,255,255,.012); border: 1px solid var(--edge); box-shadow: inset 0 0 0 1px var(--line); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel > header { padding: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: none; margin: 0; }
.lead { color: var(--ink-2); max-width: 70ch; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 0; }
.tile { padding: 4px 12px; display: grid; gap: 2px; align-content: start; border-left: 1px solid var(--line); }
.tile .k { font-family: var(--font-display); color: var(--gold); font-size: 14px; }
.tile .v { font-size: 22px; color: var(--ink-hi); }
.tile.hero .v { color: var(--good); }
.tile .s { color: var(--ink-3); font-size: 12px; }

.money { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-hi); }
.money i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px 1px 2px; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.money i.g { background: var(--coin-g); } .money i.s { background: var(--coin-s); } .money i.c { background: var(--coin-c); }
.money.neg { color: var(--bad); }
.money.pos { color: var(--good); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 0 8px; border: 1px solid; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: #2f6a2f; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: #6b4f1a; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: #6b2018; }
.pill.info { background: var(--info-soft); color: var(--info); border-color: #1f3d6b; }
.pill.mute { background: var(--panel-2); color: var(--ink-2); border-color: #3a3631; }
.pill.gold { background: #2a2208; color: var(--gold); border-color: #8a6d1c; }

.warnings { display: grid; gap: 8px; }
.warning { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; background: var(--warn-soft); color: var(--ink); border: 1px solid #6b4f1a; }
.warning b { color: var(--warn); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font-family: var(--font-display); text-align: left; font-weight: 400; color: var(--gold); font-size: 13px; padding: 4px 8px 6px; border-bottom: 1px solid var(--edge); box-shadow: 0 1px 0 var(--line); white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: #fff0a0; }
td { padding: 6px 8px; vertical-align: top; }
tbody tr:nth-child(even) td { background: rgba(255,255,255,.025); }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: linear-gradient(90deg, var(--accent-soft), rgba(255,190,60,.02)); }
tr.detail td { background: #0b0a09; padding: 12px 16px; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
tr.off td { color: var(--ink-3); }
.sub { color: var(--ink-3); font-size: 12px; }

.opp { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.opp:last-child { border-bottom: 0; }
.opp .t { color: var(--ink-hi); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opp .w { color: var(--ink-2); font-size: 14px; grid-column: 1 / -1; }
.opp .p { text-align: right; font-size: 17px; }

ul.why { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 80ch; }
.tree { font-size: 14px; display: grid; gap: 2px; }
.tree .node { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tree .kids { margin-left: 18px; padding-left: 10px; border-left: 1px solid var(--line); display: grid; gap: 2px; }

/* botones: planos y oscuros; el elegido o el principal, con borde dorado (como «Siguiente >») */
.route-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { font-family: var(--font-display); border: 1px solid #4a453e; background: linear-gradient(#2a2724, #1b1917); color: var(--ink); padding: 4px 14px; min-height: 30px; cursor: pointer; }
.seg:hover { color: var(--ink-hi); border-color: #6b6358; }
.seg[aria-pressed="true"], .btn { border: 1px solid #c9a227; background: linear-gradient(#3a2f12, #241d0b); color: var(--gold); box-shadow: inset 0 0 6px rgba(255,209,0,.15); }
.btn { font-family: var(--font-display); padding: 4px 14px; min-height: 30px; cursor: pointer; }
.btn.ghost { background: transparent; }
.route { font: 13px/1.6 var(--font-mono); background: #050505; border: 1px solid #3a3631; padding: 10px 12px; overflow-x: auto; display: grid; color: var(--ink); }
.route .l { display: grid; grid-template-columns: 56px 1fr; gap: 10px; white-space: pre; }
.route .op { font-weight: 500; }
.route .BUY .op { color: var(--info); } .route .SELL .op { color: var(--good); }
.route .CRAFT .op { color: var(--gold); } .route .NOTE .op { color: var(--ink-3); } .route .HOLD .op { color: var(--warn); }
.route .c { color: var(--ink-3); }
.route .hd { color: var(--ink-3); }
.stats { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }
.stats b { color: var(--ink-hi); }

.bar { height: 8px; background: #000; border: 1px solid var(--edge); box-shadow: 0 0 0 1px var(--line); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; background: #6b6358; }
.bar span.full { background: #8a1e14; }
.slots { display: grid; gap: 8px; }
.slots .row { display: grid; grid-template-columns: 120px 1fr 90px; gap: 10px; align-items: center; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--edge); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 14px; display: grid; gap: 8px; background: var(--panel); align-content: start; }
.card.top { box-shadow: inset 0 0 0 1px #8a6d1c, inset 0 0 10px rgba(255,209,0,.08); }
.card .big { font-size: 20px; color: var(--ink-hi); }
.gap { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="search"], input[type="text"], input[type="number"], select { font: inherit; padding: 4px 10px; min-height: 30px; border: 1px solid #3a3631; background: #050505; color: var(--ink-hi); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 11px var(--font-body); }
.chart .grid { stroke: #24211e; stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--gold); stroke-width: 2; }
.chart .ar { fill: var(--gold); opacity: .10; }
.chart .ref { stroke: var(--ink-3); stroke-dasharray: 4 4; }
.chart .qb { fill: var(--info); opacity: .45; }
.chart .dot { fill: var(--gold); stroke: var(--bg); stroke-width: 2; }
.chart .hair { stroke: var(--ink-3); stroke-width: 1; }
/* tooltip como el del juego: azul noche con borde gris */
.tip { position: fixed; pointer-events: none; background: rgba(6,8,20,.95); color: var(--ink-hi); padding: 6px 10px; border: 1px solid #8a8f99; border-radius: 3px; font-size: 13px; display: none; z-index: 20; white-space: nowrap; }
.spark { width: 90px; height: 26px; display: block; }
.spark path { fill: none; stroke: var(--gold); stroke-width: 1.5; }
.spark circle { fill: var(--gold); }
/* listas tipo «categorías» de la subasta */
.itemlist { display: grid; gap: 2px; max-height: 520px; overflow-y: auto; }
.itemlist button { text-align: left; border: 1px solid #34302b; background: var(--panel-2); color: var(--ink); padding: 5px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.itemlist button:hover { color: var(--ink-hi); }
.itemlist button[aria-pressed="true"] { background: linear-gradient(90deg, rgba(255,190,60,.22), rgba(255,190,60,.04)); border-color: #5a4a26; color: var(--ink-hi); }
.market { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
/* Inicio (versión E) */
.ini { display: grid; gap: 12px; }
.ini-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--edge); box-shadow: 0 1px 0 var(--line); }
.ini-top .lbl { font-family: var(--font-display); color: var(--gold); font-size: 14px; }
.ini-box { display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px; background: #050505; border: 1px solid #3a3631; color: var(--ink-hi); }
.ini-body { display: flex; gap: 16px; flex-wrap: wrap; }
.ini-side { flex: 1 1 200px; max-width: 250px; display: flex; flex-direction: column; gap: 2px; }
.ini-side .cap { font-size: 12px; letter-spacing: 1px; color: var(--ink-3); padding: 12px 4px 6px; }
.ini-side .cap:first-child { padding-top: 0; }
.ini-char { padding: 5px 10px; background: var(--panel-2); border: 1px solid #34302b; }
.ini-char.first { background: linear-gradient(90deg, rgba(255,190,60,.22), rgba(255,190,60,.04)); border-color: #5a4a26; }
.ini-row2 { display: flex; justify-content: space-between; gap: 8px; padding: 4px 10px; background: var(--panel-2); border: 1px solid #34302b; font-size: 14px; }
.ini-main { flex: 999 1 560px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.ini-houses .r { display: grid; grid-template-columns: 2fr 1.2fr 2.4fr .9fr; align-items: center; gap: 8px; padding: 6px 8px; }
.ini-houses .r:nth-child(even) { background: rgba(255,255,255,.025); }
.ini-houses .r.h { font-family: var(--font-display); color: var(--gold); font-size: 13px; padding-top: 0; }
.ini-houses .fac { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 8px; vertical-align: -3px; box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 3px #6e5a2a; }
.ini-sep { border-top: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--line); padding-top: 12px; }
.ini-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; }
@media (max-width: 760px) {
  body { margin-top: 0; }
  .market { grid-template-columns: 1fr; }
  .itemlist { max-height: 220px; }
  .slots .row { grid-template-columns: 90px 1fr 70px; }
  .ini-side { max-width: none; }
  .ini-houses .r { grid-template-columns: 1.6fr 1fr 1.6fr .7fr; font-size: 13px; }
}
@media (prefers-reduced-motion: no-preference) { nav a, .seg { transition: color .15s, border-color .15s; } }
</style>
</head>
<body>
<header>
  <h1>Oroboros · Plan de oro</h1>
  <div class="meta" id="meta"></div>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main>
  <section class="view" id="v-inicio"></section>
  <section class="view" id="v-resumen"></section>
  <section class="view" id="v-ruta"></section>
  <section class="view" id="v-recetas"></section>
  <section class="view" id="v-transformar"></section>
  <section class="view" id="v-aprender"></section>
  <section class="view" id="v-ideas"></section>
  <section class="view" id="v-cartera"></section>
  <section class="view" id="v-inventario"></section>
  <section class="view" id="v-mercado"></section>
  <section class="view" id="v-horas"></section>
  <section class="view" id="v-farmear"></section>
  <section class="view" id="v-subasta"></section>
  <section class="view" id="v-ventas"></section>
</main>
<div class="tip" id="tip"></div>
<script>
const PLAN = /*__PLAN__*/null;
// true cuando la sirve el panel de escritorio (tools/oroboros_panel.py): las pestañas Subasta y Ventas piden datos
const PANEL = /*__PANEL__*/false;

// Con el panel, sus pestañas van primero (Inicio, Subasta, Ventas); sin él, Subasta y Ventas al final
const API_VIEWS = [["subasta", "Subasta"], ["ventas", "Ventas"]];
const VIEWS = (PANEL ? [["inicio", "Inicio"]].concat(API_VIEWS) : []).concat(PLAN ? [
  ["resumen", "Resumen"], ["ruta", "Ruta"], ["recetas", "Qué ganas y por qué"],
  ["transformar", "Transformaciones"], ["aprender", "Qué aprender"], ["ideas", "Ideas"], ["cartera", "Cartera"], ["inventario", "Qué tienes"], ["mercado", "Mercado"], ["horas", "Horas"], ["farmear", "Farmear"],
] : []).concat(PANEL ? [] : API_VIEWS);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = ck => ck ? ck.split("-")[0] : "—";

function money(c, opts = {}) {
  if (c === null || c === undefined || isNaN(c)) return '<span class="money sub">—</span>';
  const neg = c < 0; let v = Math.round(Math.abs(c));
  const g = Math.floor(v / 10000), s = Math.floor((v % 10000) / 100), cu = v % 100;
  let parts = [];
  if (g) parts.push(`${g.toLocaleString("es-ES")}<i class="g"></i>`);
  if (g || s) parts.push(`${g ? String(s).padStart(2, "0") : s}<i class="s"></i>`);
  if (!g) parts.push(`${s ? String(cu).padStart(2, "0") : cu}<i class="c"></i>`);
  const cls = opts.color ? (neg ? " neg" : " pos") : (neg ? " neg" : "");
  const sign = neg ? "−" : (opts.signed ? "+" : "");
  return `<span class="money${cls}" title="${(c / 10000).toFixed(2)} oro">${sign}${parts.join(" ")}</span>`;
}
const confPill = c => `<span class="pill ${c === "alta" ? "good" : c === "media" ? "warn" : "bad"}" title="Confianza en el precio y en las ventas">confianza ${c}</span>`;
const pct = x => x === null || x === undefined ? "—" : `${(x * 100).toFixed(0)} %`;
const fmtN = x => x === null || x === undefined ? "—" : (Math.round(x * 10) / 10).toLocaleString("es-ES");
const itemName = id => (PLAN.items[id] && PLAN.items[id].name) || `item:${id}`;
const METHOD = { vendedor: ["vendedor", "mute"], subasta: ["subasta", "info"], fabricar: ["lo fabricas", "gold"] };

/* ---------------- Gráficas ---------------- */
function spark(id) {
  const it = PLAN.items[id]; if (!it || !it.hist || it.hist.length < 2) return "";
  const v = it.hist.map(h => h[1]).filter(x => x);
  const lo = Math.min(...v), hi = Math.max(...v), w = 90, h = 26, p = 3;
  const x = i => p + i * (w - 2 * p) / (v.length - 1), y = val => h - p - (hi === lo ? .5 : (val - lo) / (hi - lo)) * (h - 2 * p);
  const d = v.map((val, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(val).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/><circle cx="${x(v.length - 1)}" cy="${y(v[v.length - 1])}" r="2.5"/></svg>`;
}

// Rango del historial en Mercado (días; 0 = todo), al estilo CamelCamelCamel
const RANGES = [[30, "1 mes"], [90, "3 meses"], [180, "6 meses"], [365, "1 año"], [0, "Todo"]];
let mkRange = 90;
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function rangeHist(it, days) {
  const h = it.hist || []; if (!h.length) return h;
  const d = days === undefined ? mkRange : days; if (!d) return h;
  const last = h[h.length - 1][0];
  return h.filter(x => dayDiff(x[0], last) < d);
}
function priceStats(it) {
  const all = (it.hist || []).filter(h => h[1]), rng = rangeHist(it).filter(h => h[1]);
  const ext = (arr, f) => arr.length ? arr.reduce((a, b) => f(b[1], a[1]) ? b : a) : null;
  const avg = d => { const v = rangeHist(it, d).filter(h => h[1]).map(h => h[1]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  return { lowR: ext(rng, (x, y) => x < y), highR: ext(rng, (x, y) => x > y), lowA: ext(all, (x, y) => x < y), highA: ext(all, (x, y) => x > y),
           avg7: avg(7), avg30: avg(30), avg90: avg(90), first: all.length ? all[0][0] : null };
}
const fmtDay = d => d ? `${d.slice(8)}/${d.slice(5, 7)}/${d.slice(2, 4)}` : "—";
function statsTable(it) {
  const s = priceStats(it), cell = h => h ? `${money(h[1])} <span class="sub">(${fmtDay(h[0])})</span>` : "—";
  const lbl = RANGES.find(r => r[0] === mkRange)[1];
  return `<table id="mk-stats"><tbody>

    <tr><th>Media 7 / 30 / 90 días</th><td colspan="3">${money(s.avg7)} · ${money(s.avg30)} · ${money(s.avg90)} <span class="sub">· datos desde ${fmtDay(s.first)}</span></td></tr>

function lineChart(id) {
  const it = PLAN.items[id]; const hist = rangeHist(it).filter(h => h[1]);
  if (hist.length < 2) return '<p class="sub">Sin histórico suficiente.</p>';
  const W = 720, H = 240, L = 64, R = 16, T = 14, B = 28;
  const vals = hist.map(h => h[1]); const refs = [it.med7].filter(Boolean);
  let lo = Math.min(...vals, ...refs), hi = Math.max(...vals, ...refs);
  const pad = (hi - lo) * .12 || hi * .1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const x = i => L + i * (W - L - R) / (hist.length - 1), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = 4; let g = "";
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${(v / 10000).toFixed(v < 100000 ? 2 : 1)}g</text>`;
  }
  const step = Math.max(1, Math.ceil(hist.length / 10));
  hist.forEach((h, i) => { if (i % step === 0 || i === hist.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${h[0].slice(8)}/${h[0].slice(5, 7)}</text>`; });
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = d + `L${x(vals.length - 1)},${H - B}L${x(0)},${H - B}Z`;
  let ref = "";
  if (it.med7) ref = `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(it.med7)}" y2="${y(it.med7)}"/><text x="${W - R}" y="${y(it.med7) - 5}" text-anchor="end">mediana 7 días</text>`;
  const last = vals.length - 1;
  return `<svg class="chart" id="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Precio de ${esc(it.name)}">
    ${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${ref}
    <line class="hair" id="hair" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/>
    <circle class="dot" cx="${x(last)}" cy="${y(vals[last])}" r="5"/>
    <rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
}

function qtyChart(id) {
  const it = PLAN.items[id]; const hist = rangeHist(it).filter(h => h[2] !== null);
  if (hist.length < 2) return "";
  const W = 720, H = 120, L = 64, R = 16, T = 10, B = 24;
  const hi = Math.max(...hist.map(h => h[2])) * 1.1 || 1;
  const bw = (W - L - R) / hist.length;
  let g = `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><text x="${L - 6}" y="${T + 8}" text-anchor="end">${Math.round(hi)}</text><text x="${L - 6}" y="${H - B}" text-anchor="end">0</text>`;
  hist.forEach((h, i) => {
    const bh = (h[2] / hi) * (H - T - B);
    g += `<rect class="qb" x="${L + i * bw + 2}" y="${H - B - bh}" width="${Math.max(2, bw - 4)}" height="${bh}" rx="2"><title>${h[0]}: ${h[2]} publicadas</title></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cantidad publicada por día">${g}</svg>`;
}

function wireChart(id) {
  const svg = $("#lc"); if (!svg) return;
  const it = PLAN.items[id]; const hist = rangeHist(it).filter(h => h[1]);
  const tip = $("#tip"), hair = $("#hair"), hit = $("#hit");
  const L = 64, R = 16, W = 720;
  hit.addEventListener("mousemove", ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(hist.length - 1, Math.round((p.x - L) / ((W - L - R) / (hist.length - 1)))));
    const xx = L + i * (W - L - R) / (hist.length - 1);
    hair.setAttribute("x1", xx); hair.setAttribute("x2", xx); hair.style.display = "";
    tip.innerHTML = `${hist[i][0]} · ${money(hist[i][1])} · ${hist[i][2]} publicadas`;
    tip.style.display = "block"; tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY - 10) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; hair.style.display = "none"; });
}

// Datos de Forever que el catálogo da por ciertos: cada uno con su marca y su fuente
function factsHtml(facts) {
  if (!facts || !facts.length) return "";
  const ok = facts.filter(f => f.verified).length;
  const src = f => /^https?:\/\//.test(f.source || "") ? `<a href="${esc(f.source)}" target="_blank" rel="noopener noreferrer">fuente</a>` : esc(f.source || "sin fuente");
  return `<details style="margin-top:8px"><summary>Lo que el catálogo da por cierto de Forever (${ok} comprobados, ${facts.length - ok} sin comprobar)</summary>
    <ul class="why">${facts.map(f => `<li>${f.verified ? "✔ Comprobado" : "? Sin comprobar"}: ${esc(f.text)} ${f.verified && f.how ? `(${esc(f.how)}) ` : ""}— ${src(f)}</li>`).join("")}</ul></details>`;
}

let invLoc = "todo", invSort = "total";
function renderInventario() {
  const ACTION = { ruta: ["la usa la ruta", "good"], guardar: ["guardar", "info"], subasta: ["vender en subasta", "gold"], vendedor: ["al vendedor", "mute"], esperar: ["vender más tarde", "warn"], cartera: ["apuesta abierta", "gold"], nada: ["—", "mute"] };
  const LOC = { bags: "bolsas", bank: "banco", warband: "banco de banda" };
  const blocks = PLAN.inventory.map(v => {
    const slots = Object.entries(v.slots).filter(([, s]) => s).map(([loc, s]) => {
      const used = s.total - s.free, p = used / s.total * 100;
      return `<div class="row"><span>${LOC[loc]}</span><div class="bar" title="${used} de ${s.total} huecos ocupados"><span class="${s.free / s.total < .1 ? "full" : ""}" style="width:${p}%"></span></div><span class="num sub">${s.free} libres</span></div>`;
    }).join("");
    let items = v.items.filter(e => invLoc === "todo" || e.loc === invLoc);
    items.sort((a, b) => invSort === "slot" ? a.per_slot - b.per_slot : b.total - a.total);
    const rows = items.map(e => `<tr><td><b>${esc(e.name)}</b><div class="sub">${LOC[e.loc]}</div></td><td class="n">${e.count}</td>
      <td class="n">${money(e.unit)}</td><td class="n">${money(e.total)}</td><td class="n">${e.slots}</td><td class="n">${money(e.per_slot)}</td>
      <td><span class="pill ${ACTION[e.action][1]}">${ACTION[e.action][0]}</span><div class="sub">${esc(e.why)}</div></td></tr>`).join("");
    return `<div class="panel"><header><h2>${esc(v.short)}</h2><span class="stats">${v.money !== null && v.money !== undefined ? `<span>Oro <b>${money(v.money)}</b></span>` : ""}<span>Objetos <b>${money(v.value)}</b></span></span></header>
      <div class="slots">${slots}</div>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Cant.</th><th class="n">Valor/u</th><th class="n">Total</th><th class="n">Huecos</th><th class="n">Valor/hueco</th><th>Qué hacer</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Nada en esta zona.</p>'}</div>`;
  }).join("");
  $("#v-inventario").innerHTML = `<div class="panel"><header><h2>Qué tienes</h2>
      <div class="filters"><label for="invloc" class="sub">Zona</label><select id="invloc"><option value="todo">Todo</option><option value="bags">Bolsas</option><option value="bank">Banco</option><option value="warband">Banco de banda</option></select>
      <label for="invsort" class="sub">Orden</label><select id="invsort"><option value="total">Más valioso primero</option><option value="slot">Menos valor por hueco primero</option></select></div></header>
      <p class="lead">El valor de cada objeto es lo que sacarías vendiéndolo (subasta neta o vendedor, lo que sea más). Ordena por <b>valor por hueco</b> para ver qué ocupa sitio en el banco y vale poco.</p></div>` + blocks;
  $("#invloc").value = invLoc; $("#invsort").value = invSort;
  $("#invloc").onchange = e => { invLoc = e.target.value; renderInventario(); };
  $("#invsort").onchange = e => { invSort = e.target.value; renderInventario(); };
}

let mkItem = null, mkQuery = "";
function renderHoras() {
  const BANDS = ["0–4", "4–8", "8–12", "12–16", "16–20", "20–24"];
  const ids = Object.keys(PLAN.items).filter(id => PLAN.items[id].hours)
    .sort((a, b) => PLAN.items[a].name.localeCompare(PLAN.items[b].name));
  if (!ids.length) {
    $("#v-horas").innerHTML = `<div class="panel"><header><h2>Franjas horarias</h2></header>
      <p class="lead">Sin datos de franjas. Escanea varias veces al día (con <code>/reload</code> después), exporta con <code>--archive work/archivo.sqlite</code> y genera el plan con <code>--archive work/archivo.sqlite</code>.</p></div>`;
    return;
  }
  const row = id => {
    const h = PLAN.items[id].hours, max = Math.max(1, ...h.map(b => b.gone_cheap_h || 0));
    const cells = h.map(b => {
      if (b.gone_cheap_h === null) return `<td class="n" style="color:var(--muted)">—</td>`;
      const a = (b.gone_cheap_h / max) * 0.55;
      return `<td class="n" style="background:rgba(214,170,60,${a.toFixed(2)})" title="${b.n} mediciones en ${b.days} días">
        ${fmtN(b.gone_cheap_h)}/h${b.ok ? "" : " ?"}<div class="sub">${fmtN(b.gone_total_h)}/h total · ${b.price_med ? money(b.price_med) : "—"}</div></td>`;
    }).join("");
    return `<tr><td>${esc(PLAN.items[id].name)}</td>${cells}</tr>`;
  };
  $("#v-horas").innerHTML = `<div class="panel"><header><h2>Franjas horarias</h2></header>
    <p class="lead">Unidades baratas que desaparecen por hora en cada franja (debajo: el total y el precio típico). Más color = se vende más. «?» = menos de 3 mediciones en 2 días: todavía no es fiable.</p>
    <div class="tablewrap"><table><thead><tr><th>Objeto</th>${BANDS.map(b => `<th class="n">${b} h</th>`).join("")}</tr></thead>
    <tbody>${ids.map(row).join("")}</tbody></table></div></div>`;
}

      <td class="n">${money(r.per_kill)}</td>

      <details><summary>Qué matar y qué sueltan</summary><ul class="why">${r.mobs.map(m => `<li>${esc(m.name)} <span class="sub">niv. ${m.levels[0]}–${m.levels[1]} · ${pct(m.share)} de las apariciones</span> ${money(m.measured ? m.measured.per_kill : m.per_kill)}<span class="sub">/muerte${m.measured ? ` (medido, ${m.measured.kills} muertes)` : ""}</span></li>`).join("")}</ul>
      <ul class="why">${fTop(r.top_items)}</ul></details>

  const explore = !F.has_ac ? `<p class="lead">Para proponer sitios donde aún no has farmeado hace falta la base de AzerothCore: <code>python tools/oroboros_farm.py --descargar</code> (≈ 48 MB, en <code>work/fuentes/</code>).</p>`
    : !C.level ? `<p class="lead">No sé el nivel de este personaje: entra con él y haz <code>/reload</code>.</p>`
    : C.explore.length ? `<div class="cards">${C.explore.map(card).join("")}</div>` : `<p class="lead">Nada a tu nivel en mundo abierto.</p>`;

  $("#v-farmear").innerHTML = `<div class="panel"><header><h2>Farmear</h2><div class="route-tabs">${keys.map(k => `<button class="seg" aria-pressed="${k === farmChar}" data-fch="${esc(k)}">${esc(short(k))}${F.chars[k].level ? ` · ${F.chars[k].level}` : ""}</button>`).join("")}</div></header>

    <div class="panel"><header><h2>Donde ya has farmeado</h2></header>${measured}</div>
    <div class="panel"><header><h2>Por explorar</h2></header><p class="lead">Estimación inicial con la base de AzerothCore (WotLK): solo oro y materiales, sin equipo. El botín de Forever cambió, así que es aproximado hasta que lo midas.</p>${explore}</div>
    <div class="panel"><header><h2>Recolección</h2></header><p class="lead">Nodos de GatherMate2 (Forever) valorados con lo que suelta cada nodo; 30 nodos/h en un mapa denso. Solo los nodos de tu nivel de profesión (niveles del juego clásico, sin comprobar en Forever).</p>${gather}</div>`;
  $("#v-farmear").querySelectorAll("[data-fch]").forEach(b => b.onclick = () => { farmChar = b.dataset.fch; renderFarmear(); });

/* ---------------- Panel de escritorio: Subasta y Ventas (API de Blizzard) ---------------- */
const FAC = { Alliance: ["Alianza", "#4a8cff"], Horde: ["Horda", "#e0483c"], Neutral: ["Aguasnegras", "#c99a3a"] };
const facTxt = f => (FAC[f] || [f])[0], facCol = f => (FAC[f] || [0, "#8c8579"])[1];
const fmtT = t => t ? new Date(t * 1000).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
let apiItem = null, apiQuery = "", apiResults = [], apiTimer = null, apiStatusTimer = null;
async function apiGet(path, method = "GET") {
  const r = await fetch(path, { method, cache: "no-store" });
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || j.error || r.status);
  return j;
}
function needPanel(id, title) {
  $(id).innerHTML = `<div class="panel"><header><h2>${title}</h2></header><p class="lead">Esta pestaña lee la subasta de la API de Blizzard y necesita el panel de escritorio abierto: <code>pythonw tools/oroboros_panel.py</code> (ver README).</p></div>`;
}

// Gráfica de líneas por tiempo (segundos). series: [{name, color, pts: [[t, v]]}]
function timeChart(series, { H = 220, fmtY = v => (v / 10000).toFixed(v < 100000 ? 2 : 1) + "g", fmtX = t => fmtT(t), bars = false } = {}) {
  const all = series.flatMap(s => s.pts.filter(p => p[1] !== null && p[1] !== undefined));
  if (all.length < 2) return '<p class="sub">Aún no hay datos suficientes.</p>';
  const W = 720, L = 64, R = 16, T = 12, B = 28;
  const x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let lo = bars ? 0 : Math.min(...all.map(p => p[1])), hi = Math.max(...all.map(p => p[1]));
  const pad = (hi - lo) * .1 || hi * .1 || 1; if (!bars) lo = Math.max(0, lo - pad); hi += pad;
  const x = t => L + (x1 === x0 ? .5 : (t - x0) / (x1 - x0)) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtY(v)}</text>`; }
  for (let k = 0; k <= 5; k++) { const t = x0 + (x1 - x0) * k / 5; g += `<text x="${x(t)}" y="${H - 8}" text-anchor="middle">${esc(fmtX(t))}</text>`; }
  let body = "", legend = "";
  series.forEach(s => {
    const pts = s.pts.filter(p => p[1] !== null && p[1] !== undefined);
    if (!pts.length) return;
    if (bars) {
      const bw = Math.max(2, (W - L - R) / Math.max(1, all.length / series.length) - 2);
      body += pts.map(p => `<rect x="${x(p[0]) - bw / 2}" y="${y(p[1])}" width="${bw}" height="${y(lo) - y(p[1])}" fill="${s.color}" opacity=".75"><title>${esc(fmtX(p[0]))}: ${fmtN(p[1])}</title></rect>`).join("");
    } else {
      body += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    }
    legend += `<span class="sub" style="margin-right:12px"><i style="display:inline-block;width:10px;height:10px;background:${s.color};border-radius:2px"></i> ${esc(s.name)}</span>`;
  });
  return `<div>${legend}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${body}</svg>`;
}

async function refreshStatus() {
  const el = $("#api-status"); if (!el) return;
  try {
    const e = await apiGet("/api/estado"), st = e.state || {};
    const houses = e.houses.map(h => `<span>${esc(facTxt(h.faction))} <b>${h.house}</b>: foto ${fmtT(h.t)} · ${fmtN(h.auctions)} subastas</span>`).join("");
    el.innerHTML = `<header style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>Subasta (API de Blizzard)</h2>
      ${st.busy ? '<span class="pill info">descargando…</span>' : ""}${st.error ? `<span class="pill bad">${esc(st.error)}</span>` : ""}
      ${st.credentials === false ? '<span class="pill bad">faltan las credenciales</span>' : ""}
      <span style="flex:1"></span><button class="seg" id="api-now">Descargar ahora</button><button class="seg" id="api-stop">Parar el panel</button></header>
      <div class="stats">${houses || "<span>Aún no hay fotos.</span>"}<span>Próxima: <b>${fmtT(st.next_run)}</b></span></div>`;
    $("#api-now").onclick = async () => { await apiGet("/api/descargar", "POST"); setTimeout(refreshStatus, 1500); };
    $("#api-stop").onclick = async () => {
      if (!window.confirm("¿Parar el panel? Dejará de descargar cada hora hasta que lo abras otra vez.")) return;
      await apiGet("/api/parar", "POST"); el.innerHTML = '<p class="lead">Panel parado. Puedes cerrar esta ventana.</p>';
      clearInterval(apiStatusTimer);
    };
  } catch (err) { el.innerHTML = `<p class="sub">No responde el panel (${esc(err.message)}).</p>`; }
}

function renderApiList() {
  const el = $("#api-list"); if (!el) return;
  el.innerHTML = apiResults.map(r => `<button aria-pressed="${r.id === apiItem}" data-aid="${r.id}"><span>${esc(r.name)}</span><span class="sub">${Object.values(r.prices).length ? money(Math.min(...Object.values(r.prices))) : ""}</span></button>`).join("")
    || `<p class="sub">${apiQuery.length < 2 ? "Escribe al menos 2 letras o el número del objeto." : "Nada con ese nombre."}</p>`;
  el.querySelectorAll("[data-aid]").forEach(b => b.onclick = () => { apiItem = +b.dataset.aid; renderApiList(); loadApiItem(); });
}

async function loadApiItem() {
  const el = $("#api-item"); if (!el || !apiItem) return;
  el.innerHTML = '<p class="sub">Cargando…</p>';
  try {
    const o = await apiGet(`/api/objeto/${apiItem}`);
    const hs = Object.entries(o.houses);
    const cards = hs.map(([h, d]) => {
      const last = d.hourly.length ? d.hourly[d.hourly.length - 1] : null, r = d.rates || {};
      return `<div class="panel" style="border-left:4px solid ${facCol(d.faction)}"><b>${esc(facTxt(d.faction))} (${h})</b>
        <div class="stats"><span>Mínimo <b>${money(last && last[1])}</b></span><span>Mercado <b>${money(last && last[2])}</b></span><span>Publicadas <b>${fmtN(last && last[3])}</b></span></div>
        <div class="stats"><span>Vendidas/día <b>${fmtN(r.sold)}</b></span><span>Caducadas/día <b>${fmtN(r.expired)}</b></span><span>Canceladas/día <b>${fmtN(r.cancelled)}</b></span><span class="sub">${d.days} días de fotos</span></div></div>`;
    }).join("");
    const hourly = timeChart(hs.map(([h, d]) => ({ name: `${facTxt(d.faction)} ${h}`, color: facCol(d.faction), pts: d.hourly.map(r => [r[0], r[1]]) })));
    const soldH = timeChart(hs.slice(0, 1).map(([h, d]) => ({ name: `Vendidas por foto (${facTxt(d.faction)} ${h})`, color: facCol(d.faction), pts: d.hourly.filter(r => r[4] !== null).map(r => [r[0], r[4]]) })), { bars: true, fmtY: v => fmtN(v), H: 140 });
    const dayT = d => new Date(d + "T12:00:00").getTime() / 1000;
    const daily = timeChart(hs.map(([h, d]) => ({ name: `${facTxt(d.faction)} ${h}`, color: facCol(d.faction), pts: d.daily.map(r => [dayT(r[0]), r[1]]) })), { fmtX: t => fmtT(t).slice(0, 5) });
    const bandRows = hs.map(([h, d]) => `<tr><td>${esc(facTxt(d.faction))} ${h}</td>${(d.bands.length ? d.bands : Array(6).fill(null)).map(b => b && b.hours ? `<td class="n" title="${fmtN(b.n)} mediciones en ${b.days} días">${fmtN((b.sold + b.partial) / b.hours)}<span class="sub"> / ${fmtN((b.expired + b.cancelled) / b.hours)}</span></td>` : '<td class="n sub">—</td>').join("")}</tr>`).join("");
    const inv = o.inventory.length ? `<ul>${o.inventory.map(r => `<li>${esc(short(r[0]))} · ${esc(r[1])}: <b>${fmtN(r[2])}</b></li>`).join("")}</ul>` : '<p class="sub">No tienes ninguno (según el último export).</p>';
    const led = o.ledger.length ? `<div class="tablewrap"><table><thead><tr><th>Cuándo</th><th>Quién</th><th>Tipo</th><th class="n">Cant.</th><th class="n">Precio/u</th></tr></thead><tbody>${o.ledger.map(r => `<tr><td>${fmtT(r[0])}</td><td>${esc(short(r[1]))}</td><td>${r[2] === "BUY" ? "compra" : "venta"}</td><td class="n">${fmtN(r[3])}</td><td class="n">${money(r[4])}</td></tr>`).join("")}</tbody></table></div>` : '<p class="sub">Sin compras ni ventas tuyas.</p>';
    el.innerHTML = `<header style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>${esc(o.name)}</h2><span class="sub">objeto ${o.id}${o.vendor_sell ? ` · al vendedor ${money(o.vendor_sell)}` : ""}</span></header>
      <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${cards}</div>
      <h3>Precio mínimo por hora (14 días)</h3>${hourly}
      <h3>Vendidas estimadas por foto</h3>${soldH}
      <h3>Precio mínimo por día (todo el historial)</h3>${daily}
      <h3>Por franja: vendidas / caducadas y canceladas, por hora</h3>
      <div class="tablewrap"><table><thead><tr><th>Casa</th>${[0, 4, 8, 12, 16, 20].map(a => `<th class="n">${a}–${a + 4} h</th>`).join("")}</tr></thead><tbody>${bandRows}</tbody></table></div>
      <h3>Qué tienes</h3>${inv}<h3>Tus compras y ventas</h3>${led}`;
  } catch (err) { el.innerHTML = `<p class="sub">Error: ${esc(err.message)}</p>`; }
}

// --- Inicio: ritmo de descarga, el juego y lo importante (GET /api/inicio) ---
let iniTimer = null, iniTick = null;
const fmtAgo = (t, now) => {
  if (!t) return "nunca";
  const m = Math.max(0, Math.round((now - t) / 60));
  if (m < 1) return "ahora mismo";
  if (m < 60) return `hace ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 48) return `hace ${h} h${m % 60 ? ` ${m % 60} min` : ""}`;
  return `hace ${Math.floor(h / 24)} días`;
};
const fmtLeft = s => {
  if (s <= 0) return "ahora";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.floor(s % 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m}:${String(x).padStart(2, "0")}`;
};
// Las últimas 24 h de una casa: verde con foto, rojo en los huecos
function strip24(gaps, now) {
  const W = 240, x = t => Math.max(0, Math.min(W, (t - (now - 86400)) / 86400 * W));
  const red = gaps.map(([a, b]) => `<rect x="${x(a)}" y="0" width="${Math.max(1, x(b) - x(a))}" height="8" fill="#8a1e14"><title>Sin fotos: ${fmtT(a)} → ${fmtT(b)}</title></rect>`).join("");
  return `<svg viewBox="0 0 ${W} 8" preserveAspectRatio="none" style="width:100%;height:8px;display:block;background:#000;outline:1px solid #2c2925"><rect width="${W}" height="8" fill="#2f8f3a"/>${red}</svg>`;
}
// Colores del juego: clase del personaje y calidad del objeto
const CLASS_COL = { WARRIOR: "#c69b6d", PALADIN: "#f48cba", HUNTER: "#aad372", ROGUE: "#fff468", PRIEST: "#ffffff", SHAMAN: "#0070dd",
  MAGE: "#3fc7eb", WARLOCK: "#8788ee", MONK: "#00ff98", DRUID: "#ff7c0a", DEMONHUNTER: "#a330c9", DEATHKNIGHT: "#c41e3a", EVOKER: "#33937f" };
const QUAL_COL = ["#9d9d9d", "#ffffff", "#1eff00", "#0070dd", "#a335ee", "#ff8000", "#e6cc80", "#00ccff"];
const qualTxt = q => q === 3 ? "#3d9bff" : q === 4 ? "#c070ff" : (QUAL_COL[q] || "#ffffff");   // azul y morado, un poco más claros para leerse sobre negro

async function loadInicio() {
  const el = $("#v-inicio"); if (!el) return;
  let d;
  try { d = await apiGet("/api/inicio"); }
  catch (err) { el.innerHTML = `<div class="panel"><p class="sub">No responde el panel (${esc(err.message)}).</p></div>`; return; }
  const offset = Date.now() / 1000 - d.now;          // reloj del PC frente al del panel
  const now = d.now, a = d.api, g = d.game, p = d.plan, top = d.top;
  // Distribución de la versión E: arriba la línea de estado (como el buscador de la subasta), a la izquierda los
  // personajes (como las categorías), en el centro las casas (como la lista de precios) y debajo lo importante.
  const houses = a.houses.map(h => {
    const late = !h.t || now - h.t > 90 * 60;
    return `<div class="r"><span><i class="fac" style="background:radial-gradient(circle at 40% 35%, ${facCol(h.faction)}, #0a0a0a 110%)"></i><b>${esc(facTxt(h.faction))} ${h.house}</b></span>
      <span title="${fmtT(h.t)}">${fmtAgo(h.t, now)}</span>
      <span>${strip24(h.gaps, now)}</span>
      <span class="n" style="text-align:right">${late ? '<span class="pill bad">sin foto</span> ' : ""}<b>${h.snaps24}</b> / 24</span></div>`;
  }).join("");
  const nextTxt = a.busy ? '<span class="pill info">descargando…</span>'
    : a.next_run ? `en <b data-until="${a.next_run}">${fmtLeft(a.next_run - now)}</b> <span class="sub">(${fmtT(a.next_run)})</span>`
    : a.credentials === false ? '<span class="pill bad">faltan las credenciales</span>' : '<span class="sub">calculando…</span>';
  const chars = g.chars.map((c, i) => `<div class="ini-char${i === 0 ? " first" : ""}"><span style="display:block;color:${CLASS_COL[c.class] || "#e6e0d0"}">${esc(c.name)} <span class="sub">nv ${c.level ?? "?"}</span></span>${money(c.money)}</div>`).join("")
    || '<p class="sub">Aún no hay personajes exportados.</p>';
  const banks = g.chars.map(c => `<div class="ini-row2"><span>${esc(c.name)}</span>${c.bank_t
    ? `<span style="color:${now - c.bank_t > 3 * 86400 ? "var(--bad)" : "var(--ink-hi)"}">${fmtAgo(c.bank_t, now)}</span>` : '<span style="color:var(--warn)">sin abrir</span>'}</div>`).join("");
  const cal = top.calibration, calOk = top.calibrated;
  const calTxt = calOk ? `<span class="pill good">comprobadas con tus ventas (${Math.round((cal.coverage || 0) * 100)} %)</span>`
    : `<span style="color:var(--warn);font-size:13px">sin comprobar con tus ventas${cal && cal.sales ? ` (${cal.sales} ventas, ${Math.round((cal.coverage || 0) * 100)} %)` : ""}</span>`;
  const topList = calOk && top.items.length
    ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Vendidas/día</th><th class="n">Precio por unidad</th></tr></thead><tbody>${top.items.map(x => `<tr><td style="color:${qualTxt(x.quality)}">${esc(x.name)}</td><td class="n">${fmtN(x.sold)}</td><td class="n">${money(x.min)}</td></tr>`).join("")}</tbody></table></div>`
    : '<p class="sub">Las ventas que estima la API aún no se han comprobado con tus ventas reales, así que aquí no se muestran: las primeras cifras eran recolocaciones, no ventas. Se comprueban solas cada día cuando vendes algo; mientras tanto están en la pestaña Ventas.</p>';
  const bg = d.bargains || { items: [] };
  const bgList = bg.items.length
    ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Unidades</th><th class="n">Precio</th><th class="n">Habitual</th><th class="n">Descuento</th><th class="n">Diferencia</th></tr></thead><tbody>${bg.items.map(x => `<tr><td style="color:${qualTxt(x.quality)}">${esc(x.name)}</td><td class="n">${fmtN(x.qty)}</td><td class="n">${money(x.price)}</td><td class="n">${money(x.usual)}</td><td class="n">−${Math.round(x.discount * 100)} %</td><td class="n">${money(x.saving)}</td></tr>`).join("")}</tbody></table></div>
       <p class="sub">Subastas nuevas de la última foto, al menos un 30 % por debajo de la mediana de 7 días del objeto y sin otras más viejas a ese precio. «Diferencia» es lo que quedaría revendiéndolo todo al precio habitual, quitada la comisión: un tope, no una promesa. Las unidades no pasan de la mitad de lo que se vende al día, y esas ventas son estimadas. Cuando llegues al juego puede que ya no estén.</p>`
    : '<p class="sub">En la última foto no ha aparecido nada un 30 % por debajo de su precio habitual.</p>';
  el.innerHTML = `<div class="panel ini">
    <div class="ini-top">
      <span class="lbl">Próxima descarga</span><span class="ini-box">${nextTxt}</span>
      <span class="lbl">Último escaneo</span><span class="ini-box" title="${g.scan_items ? fmtN(g.scan_items) + " objetos" : ""}">${fmtAgo(g.scan_t, now)}</span>
      <span class="lbl">Guardado</span><span class="ini-box" title="/reload o salir del juego">${fmtAgo(g.sv_t, now)}</span>
      ${a.error ? `<span class="pill bad">${esc(a.error)}</span>` : ""}
      <span style="flex:1"></span><button class="btn" id="ini-now">Descargar ahora</button><button class="seg" id="ini-stop">Parar el panel</button>
    </div>
    <div class="ini-body">
      <div class="ini-side"><span class="cap">PERSONAJES</span>${chars}<span class="cap">BANCO LEÍDO</span>${banks}</div>
      <div class="ini-main">
        <div class="ini-houses"><div class="r h"><span>Casa de subastas</span><span>Última foto</span><span>Últimas 24 h</span><span style="text-align:right">Fotos</span></div>
          ${houses || '<p class="sub">Aún no hay fotos de la API.</p>'}
          <p class="sub" style="margin:6px 8px 0">Una foto por hora, hacia el minuto 22; el panel la pide al 25 y solo mientras está abierto. En rojo, las horas sin foto: ahí no se estiman ventas.</p></div>
        <div class="ini-sep">${p ? `<div class="tiles">
          <div class="tile"><span class="k">Oro de tus personajes</span><span class="v">${money(p.gold)}</span></div>
          <div class="tile hero"><span class="k">Beneficio del plan</span><span class="v">${money(p.profit)}</span><span class="s">${p.roi ? "+" + Math.round(p.roi * 100) + " % sobre lo invertido" : ""}</span></div>
          <div class="tile"><span class="k">Inversión</span><span class="v">${money(p.investment)}</span></div>
          <div class="tile"><span class="k">Te sobra, a la venta</span><span class="v">${money(p.stock_sale)}</span><span class="s">bolsas y banco · plan ${fmtAgo(p.generated, now)}</span></div>
        </div>` : '<p class="sub">Aún no hay plan.</p>'}</div>
        <div class="ini-sep" style="display:grid;gap:6px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>Gangas de la última foto</h3><span class="sub">${bg.t ? fmtAgo(bg.t, now) : ""}</span></div>${bgList}</div>
        <div class="ini-sep" style="display:grid;gap:6px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>Lo más vendido en tu casa (24 h)</h3>${calTxt}</div>${topList}</div>
      </div>
    </div></div>`;
  $("#ini-now").onclick = async () => { await apiGet("/api/descargar", "POST"); setTimeout(loadInicio, 1500); };
  $("#ini-stop").onclick = async () => {
    if (!window.confirm("¿Parar el panel? Dejará de descargar cada hora hasta que lo abras otra vez.")) return;
    await apiGet("/api/parar", "POST");
    clearInterval(iniTimer); clearInterval(iniTick); clearInterval(apiStatusTimer);
    $("#v-inicio").innerHTML = '<div class="panel"><p class="lead">Panel parado. Puedes cerrar esta ventana.</p></div>';
  };
  clearInterval(iniTick);
  iniTick = setInterval(() => {
    if (!$("#v-inicio").classList.contains("on")) return;
    const t = Date.now() / 1000 - offset;
    document.querySelectorAll("#v-inicio [data-until]").forEach(s => { s.textContent = fmtLeft(+s.dataset.until - t); });
  }, 1000);
}

function renderInicio() {
  if (!PANEL) return needPanel("#v-inicio", "Inicio");
  if (!$("#v-inicio").innerHTML) $("#v-inicio").innerHTML = '<div class="panel"><p class="sub">Cargando…</p></div>';
  loadInicio();
  clearInterval(iniTimer);
  iniTimer = setInterval(() => { if ($("#v-inicio").classList.contains("on")) loadInicio(); }, 30000);
}

function renderSubasta() {
  if (!PANEL) return needPanel("#v-subasta", "Subasta");
  $("#v-subasta").innerHTML = `<div class="panel" id="api-status"><p class="sub">Cargando…</p></div>
    <div class="panel market"><div><label class="sub" for="apq">Buscar objeto (nombre o número)</label>
      <input type="search" id="apq" value="${esc(apiQuery)}" placeholder="Hierro, 2589…" style="width:100%;margin:4px 0 8px"><div class="itemlist" id="api-list"></div></div>
      <div id="api-item" style="display:grid;gap:12px;min-width:0"><p class="sub">Busca un objeto para ver su precio en las tres casas, sus ventas estimadas y sus franjas.</p></div></div>`;
  refreshStatus();
  clearInterval(apiStatusTimer); apiStatusTimer = setInterval(() => { if (location.hash === "#subasta") refreshStatus(); }, 60000);
  $("#apq").oninput = e => {
    apiQuery = e.target.value; clearTimeout(apiTimer);
    apiTimer = setTimeout(async () => { apiResults = apiQuery.trim().length >= 2 || /^\d+$/.test(apiQuery.trim()) ? await apiGet(`/api/buscar?q=${encodeURIComponent(apiQuery.trim())}`) : []; renderApiList(); }, 250);
  };
  renderApiList();
  if (apiItem) loadApiItem();
}

async function renderVentas() {
  if (!PANEL) return needPanel("#v-ventas", "Ventas");
  const el = $("#v-ventas");
  el.innerHTML = '<div class="panel"><p class="sub">Cargando…</p></div>';
  try {
    const v = await apiGet("/api/ventas?dias=7");
    el.innerHTML = `<div class="panel"><header><h2>Ventas estimadas (7 días)</h2></header>
      <p class="lead">Comparando fotos por subasta: lo que desaparece barato cuenta como vendido, con <i>SHORT</i> como caducado y lo caro como cancelado; las bajadas de cantidad de los materiales, como compras. Es una <b>estimación</b>: se comprueba con tus ventas reales del correo.</p>
      <div id="calib"></div><button class="seg" id="calib-now">Calibrar ahora con mi libro</button></div>` +
      v.houses.map(h => {
        const c = h.calibration;
        const cal = c ? `Calibración: ${c.sales} ventas tuyas comprobadas, cobertura <b>${pct(c.coverage)}</b>, tu parte de lo vendido ${pct(c.share)}.` : "Sin calibrar todavía.";
        const rows = h.top.map(r => `<tr><td><a href="#subasta" data-goto="${r.id}">${esc(r.name)}</a></td><td class="n">${fmtN(r.sold)}</td><td class="n">${fmtN(r.expired)}</td><td class="n">${fmtN(r.cancelled)}</td><td class="n">${fmtN(r.new)}</td><td class="n">${money(r.min)}</td><td class="n">${money(r.value)}</td></tr>`).join("");
        return `<div class="panel" style="border-left:4px solid ${facCol(h.faction)}"><header><h2>${esc(facTxt(h.faction))} (${h.house})</h2><span class="sub">${h.days} días de fotos · ${cal}</span></header>
          ${rows ? `<div class="tablewrap"><table><thead><tr><th>Objeto</th><th class="n">Vendidas/día</th><th class="n">Caducadas/día</th><th class="n">Canceladas/día</th><th class="n">Publicadas/día</th><th class="n">Mínimo</th><th class="n">Valor vendido/día</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Hacen falta al menos dos fotos seguidas.</p>'}</div>`;
      }).join("");
    el.querySelectorAll("[data-goto]").forEach(a => a.onclick = () => { apiItem = +a.dataset.goto; apiResults = []; });
    $("#calib-now").onclick = async () => {
      $("#calib").innerHTML = '<p class="sub">Calibrando…</p>';
      const k = await apiGet("/api/calibrar");
      $("#calib").innerHTML = k.map(c => c.error ? `<p class="sub">${esc(c.error)}</p>` :
        `<p>Casa <b>${c.house}</b>: ${c.sales} ventas tuyas con fotos (${fmtN(c.units)} u.); la estimación ve ${fmtN(c.covered)} como vendidas → cobertura <b>${pct(c.coverage)}</b>; ${c.outside} ventas sin fotos.</p>` +
        (c.detail.filter(d => d.covered < d.qty).length ? `<div class="tablewrap"><table><thead><tr><th>Cuándo</th><th>Objeto</th><th class="n">Vendiste</th><th class="n">Vendidas</th><th class="n">Canceladas</th><th class="n">Caducadas</th></tr></thead><tbody>${c.detail.filter(d => d.covered < d.qty).map(d => `<tr><td>${fmtT(d.t)}</td><td>${d.item}</td><td class="n">${fmtN(d.qty)}</td><td class="n">${fmtN(d.sold)}</td><td class="n">${fmtN(d.cancelled)}</td><td class="n">${fmtN(d.expired)}</td></tr>`).join("")}</tbody></table></div>` : "")).join("");
    };
  } catch (err) { el.innerHTML = `<div class="panel"><p class="sub">Error: ${esc(err.message)}</p></div>`; }
}

const RENDER = PLAN ? { resumen: renderResumen, ruta: renderRuta, recetas: renderRecetas, transformar: renderTransformar, aprender: renderAprender, ideas: renderIdeas, cartera: renderCartera, inventario: renderInventario, mercado: renderMercado, horas: renderHoras, farmear: renderFarmear } : {};
RENDER.subasta = renderSubasta; RENDER.ventas = renderVentas; RENDER.inicio = renderInicio;
function show() {
  const h = location.hash.replace("#", "");
  const v = RENDER[h] ? h : (PANEL ? "inicio" : PLAN ? "resumen" : "subasta");
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === v ? "page" : "false"));
  RENDER[v]();
}
$("#tabs").innerHTML = VIEWS.map(([k, t]) => `<a href="#${k}" data-v="${k}">${t}</a>`).join("");
renderMeta();
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
